apiVersion: scm.wxops.cloud/v1alpha1
kind: XScmConnection
metadata:
  name: gitea-internal
spec:
  crossplane:
    resourceRefs:
      - apiVersion: kubernetes.crossplane.io/v1alpha2
        kind: Object
        name: gitea-internal-credentials
      - apiVersion: opentofu.upbound.io/v1beta1
        kind: Workspace
        name: gitea-internal-inspect
status:
  conditions:
    - reason: WatchCircuitClosed
      status: 'True'
      type: Responsive
    - reason: ReconcileSuccess
      status: 'True'
      type: Synced
    - reason: Available
      status: 'True'
      type: Ready
  created: true
  org:
    exists: true
    id: '7'
    name: wxops-idp
    url: http://gitea-http.gitea.svc.cluster.local:3000/wxops-idp
  ready: true
  repositories:
    count: 2
    names:
      - payment-api
      - web
  teams:
    count: 3
    names:
      - Developers
      - Owners
      - Reviewers
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: credentials
  labels:
    crossplane.io/composite: gitea-internal
  name: gitea-internal-credentials
  ownerReferences:
    - apiVersion: scm.wxops.cloud/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: XScmConnection
      name: gitea-internal
      uid: 63849233-b838-5f99-ba54-9391afc8b9e6
spec:
  forProvider:
    manifest:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: scm-connection-gitea-internal
        namespace: crossplane-system
      spec:
        data:
          - remoteRef:
              key: scm/gitea-internal/credentials
              property: token
            secretKey: token
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: vault-platform
        target:
          creationPolicy: Owner
          name: scm-connection-gitea-internal
          template:
            data:
              credentials: 'vendor      = "gitea"

                base_url    = "http://gitea-http.gitea.svc.cluster.local:3000"

                default_org = "wxops-idp"

                access      = "write"

                token       = "{{ .token }}"

                '
            engineVersion: v2
  providerConfigRef:
    name: default
---
apiVersion: opentofu.upbound.io/v1beta1
kind: Workspace
metadata:
  annotations:
    crossplane.io/composition-resource-name: inspect
  labels:
    crossplane.io/composite: gitea-internal
  name: gitea-internal-inspect
  ownerReferences:
    - apiVersion: scm.wxops.cloud/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: XScmConnection
      name: gitea-internal
      uid: 63849233-b838-5f99-ba54-9391afc8b9e6
spec:
  forProvider:
    module: "terraform {\n  required_providers {\n    gitea = { source = \"go-gitea/gitea\", version = \"~> 0.8\" }\n  }\n}\n\n# \u2500\u2500 From the XScmConnection Secret (varFiles) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nvariable \"vendor\" { type = string }\nvariable \"base_url\" { type = string }\nvariable \"default_org\" { type = string }\nvariable \"access\" { type = string }\nvariable \"token\" {\n  type      = string\n  sensitive = true\n}\n\nlocals {\n  # Names are capped so a very large org cannot bloat the XR; the counts\n  # stay exact.\n  max_names = 50\n}\n\nprovider \"gitea\" {\n  base_url = var.base_url\n  token    = var.token\n}\n\n# A missing org fails the read, so the outputs below never appear for one.\ndata \"gitea_org\" \"this\" {\n  name = var.default_org\n}\n\n# Listing teams needs the token's user to be a member of the org.\ndata \"gitea_teams\"\
      \ \"this\" {\n  organisation = var.default_org\n}\n\n# `username` is the owner \u2014 an org name works as well as a user name.\ndata \"gitea_repositories\" \"this\" {\n  username = var.default_org\n}\n\nlocals {\n  team_names = sort([for t in data.gitea_teams.this.teams : t.name])\n  repo_names = sort([for r in data.gitea_repositories.this.repositories : r.name])\n}\n\noutput \"org_exists\" {\n  value = \"true\"\n}\noutput \"org_name\" {\n  value = data.gitea_org.this.name\n}\noutput \"org_id\" {\n  value = tostring(data.gitea_org.this.id)\n}\noutput \"org_url\" {\n  value = \"${trimsuffix(var.base_url, \"/\")}/${var.default_org}\"\n}\noutput \"repositories_count\" {\n  value = tostring(length(local.repo_names))\n}\noutput \"repositories_names\" {\n  value = jsonencode(slice(local.repo_names, 0, min(local.max_names, length(local.repo_names))))\n}\noutput \"teams_count\" {\n  value = tostring(length(local.team_names))\n}\noutput \"teams_names\" {\n  value = jsonencode(slice(local.team_names,\
      \ 0, min(local.max_names, length(local.team_names))))\n}\n"
    source: Inline
    varFiles:
      - secretKeyRef:
          key: credentials
          name: scm-connection-gitea-internal
          namespace: crossplane-system
        source: SecretKey
  providerConfigRef:
    name: default
