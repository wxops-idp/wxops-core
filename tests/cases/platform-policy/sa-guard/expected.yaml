apiVersion: auth.wxops.cloud/v1alpha1
kind: XPlatformPolicy
metadata:
  name: sa-guard
spec:
  crossplane:
    resourceRefs:
      - apiVersion: kubernetes.crossplane.io/v1alpha2
        kind: Object
        name: f1d6c518-policy
status:
  conditions:
    - reason: WatchCircuitClosed
      status: 'True'
      type: Responsive
    - reason: ReconcileSuccess
      status: 'True'
      type: Synced
    - message: 'Unready resources: f1d6c518-policy'
      reason: Creating
      status: 'False'
      type: Ready
  created: false
  policyKind: ValidatingPolicy
  policyName: wxops-sa-guard
  ready: false
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: f1d6c518-policy
  labels:
    crossplane.io/composite: sa-guard
  name: f1d6c518-policy
  ownerReferences:
    - apiVersion: auth.wxops.cloud/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: XPlatformPolicy
      name: sa-guard
      uid: f1d6c518-911c-50a6-a182-fdbc22d36086
spec:
  forProvider:
    manifest:
      apiVersion: policies.kyverno.io/v1
      kind: ValidatingPolicy
      metadata:
        labels:
          auth.wxops.cloud/policy: sa-guard
          auth.wxops.cloud/template: sa-guard
          wxops.cloud/managed-by: platform-policy
        name: wxops-sa-guard
      spec:
        evaluation:
          background:
            enabled: false
        failurePolicy: Fail
        matchConditions:
          - expression: '!request.userInfo.username.startsWith(''system:'') && request.userInfo.groups.exists(g, [''wxops-idp:''].exists(p, g.startsWith(p)))'
            name: scm-user
          - expression: '!(request.userInfo.groups.exists(g, g in [''wxops-idp:platform'']) || request.userInfo.username in [''root''])'
            name: not-exempt
        matchConstraints:
          resourceRules:
            - apiGroups:
                - ''
              apiVersions:
                - '*'
              operations:
                - CREATE
                - UPDATE
              resources:
                - pods
            - apiGroups:
                - apps
              apiVersions:
                - '*'
              operations:
                - CREATE
                - UPDATE
              resources:
                - deployments
                - statefulsets
                - daemonsets
                - replicasets
            - apiGroups:
                - batch
              apiVersions:
                - '*'
              operations:
                - CREATE
                - UPDATE
              resources:
                - jobs
                - cronjobs
        validationActions:
          - Deny
        validations:
          - expression: variables.serviceAccount == 'default' || dyn(resource.List('v1', 'serviceaccounts', request.namespace).items).exists(s, s.metadata.name == variables.serviceAccount && has(s.metadata.labels) && 'wxops.cloud/owner' in s.metadata.labels && s.metadata.labels['wxops.cloud/owner'] in variables.teams)
            messageExpression: "'auth.wxops.cloud: ServiceAccount ' + variables.serviceAccount + ' is not owned by one of your teams [' + variables.teams.join(', ') + '] \u2014 run as default or your own'"
        variables:
          - expression: request.userInfo.groups.filter(g, ['wxops-idp:'].exists(p, g.startsWith(p))).map(g, g.substring(g.indexOf(':') + 1))
            name: teams
          - expression: 'object.kind == ''Pod'' ? object.spec : object.kind == ''CronJob'' ? object.spec.jobTemplate.spec.template.spec : object.spec.template.spec'
            name: podSpec
          - expression: 'has(variables.podSpec.serviceAccountName) && variables.podSpec.serviceAccountName != '''' ? variables.podSpec.serviceAccountName : has(variables.podSpec.serviceAccount) && variables.podSpec.serviceAccount != '''' ? variables.podSpec.serviceAccount : ''default'''
            name: serviceAccount
  providerConfigRef:
    name: default
