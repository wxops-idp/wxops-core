apiVersion: auth.wxops.cloud/v1alpha1
kind: XPlatformPolicy
metadata:
  name: namespace-guard
spec:
  crossplane:
    resourceRefs:
      - apiVersion: kubernetes.crossplane.io/v1alpha2
        kind: Object
        name: c3f61c34-policy
status:
  conditions:
    - reason: WatchCircuitClosed
      status: 'True'
      type: Responsive
    - reason: ReconcileSuccess
      status: 'True'
      type: Synced
    - message: 'Unready resources: c3f61c34-policy'
      reason: Creating
      status: 'False'
      type: Ready
  created: false
  policyKind: ValidatingPolicy
  policyName: wxops-namespace-guard
  ready: false
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: c3f61c34-policy
  labels:
    crossplane.io/composite: namespace-guard
  name: c3f61c34-policy
  ownerReferences:
    - apiVersion: auth.wxops.cloud/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: XPlatformPolicy
      name: namespace-guard
      uid: c3f61c34-f781-58f6-8793-0ddca58f033b
spec:
  forProvider:
    manifest:
      apiVersion: policies.kyverno.io/v1
      kind: ValidatingPolicy
      metadata:
        labels:
          auth.wxops.cloud/policy: namespace-guard
          auth.wxops.cloud/template: namespace-guard
          wxops.cloud/managed-by: platform-policy
        name: wxops-namespace-guard
      spec:
        evaluation:
          background:
            enabled: false
        failurePolicy: Ignore
        matchConditions:
          - expression: '!request.userInfo.username.startsWith(''system:'') && request.userInfo.groups.exists(g, [''wxops-idp:''].exists(p, g.startsWith(p)))'
            name: scm-user
          - expression: '!(request.userInfo.groups.exists(g, g in [''wxops-idp:platform'']) || request.userInfo.username in [''root''])'
            name: not-exempt
        matchConstraints:
          resourceRules:
            - apiGroups:
                - ''
              apiVersions:
                - '*'
              operations:
                - CREATE
                - UPDATE
                - DELETE
              resources:
                - namespaces
        validationActions:
          - Audit
        validations:
          - expression: request.operation == 'UPDATE'
            message: 'auth.wxops.cloud: Namespaces are created and deleted by the platform team'
          - expression: 'request.operation != ''UPDATE'' || [''wxops.cloud/owner'', ''auth.wxops.cloud/tenant-namespace'', ''wxops.cloud/environment''].all(k, (has(object.metadata.labels) && k in object.metadata.labels ? object.metadata.labels[k] : '''') == (has(oldObject.metadata.labels) && k in oldObject.metadata.labels ? oldObject.metadata.labels[k] : ''''))'
            message: 'auth.wxops.cloud: a Namespace''s wxops.cloud/owner, auth.wxops.cloud/tenant-namespace and wxops.cloud/environment labels change only by the platform team'
  providerConfigRef:
    name: default
