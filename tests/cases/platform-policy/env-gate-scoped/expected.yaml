apiVersion: auth.wxops.cloud/v1alpha1
kind: XPlatformPolicy
metadata:
  name: env-gate-scoped
spec:
  crossplane:
    resourceRefs:
      - apiVersion: kubernetes.crossplane.io/v1alpha2
        kind: Object
        name: 7786e693-policy
status:
  conditions:
    - reason: WatchCircuitClosed
      status: 'True'
      type: Responsive
    - reason: ReconcileSuccess
      status: 'True'
      type: Synced
    - message: 'Unready resources: 7786e693-policy'
      reason: Creating
      status: 'False'
      type: Ready
  created: false
  policyKind: ValidatingPolicy
  policyName: wxops-env-gate-scoped
  ready: false
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: 7786e693-policy
  labels:
    crossplane.io/composite: env-gate-scoped
  name: 7786e693-policy
  ownerReferences:
    - apiVersion: auth.wxops.cloud/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: XPlatformPolicy
      name: env-gate-scoped
      uid: 7786e693-4121-5094-b6e6-0a266fc6a89b
spec:
  forProvider:
    manifest:
      apiVersion: policies.kyverno.io/v1
      kind: ValidatingPolicy
      metadata:
        labels:
          auth.wxops.cloud/policy: env-gate-scoped
          auth.wxops.cloud/template: env-gate
          wxops.cloud/managed-by: platform-policy
        name: wxops-env-gate-scoped
      spec:
        evaluation:
          background:
            enabled: false
        failurePolicy: Fail
        matchConditions:
          - expression: '!(request.resource.group in [''authentication.k8s.io'', ''authorization.k8s.io'', ''login.concierge.pinniped.dev'', ''identity.concierge.pinniped.dev'']) && !(request.resource.resource in [''events'', ''leases''])'
            name: not-excluded
          - expression: '!request.userInfo.username.startsWith(''system:'') && request.userInfo.groups.exists(g, [''wxops-idp:''].exists(p, g.startsWith(p)))'
            name: scm-user
        matchConstraints:
          excludeResourceRules:
            - apiGroups:
                - authentication.k8s.io
                - authorization.k8s.io
                - login.concierge.pinniped.dev
                - identity.concierge.pinniped.dev
              apiVersions:
                - '*'
              operations:
                - '*'
              resources:
                - '*'
            - apiGroups:
                - ''
                - events.k8s.io
              apiVersions:
                - '*'
              operations:
                - '*'
              resources:
                - events
            - apiGroups:
                - coordination.k8s.io
              apiVersions:
                - '*'
              operations:
                - '*'
              resources:
                - leases
          namespaceSelector:
            matchExpressions:
              - key: wxops.cloud/sandbox
                operator: DoesNotExist
              - key: wxops.cloud/environment
                operator: In
                values:
                  - prod
                  - staging
            matchLabels:
              auth.wxops.cloud/tenant-namespace: 'true'
          resourceRules:
            - apiGroups:
                - '*'
              apiVersions:
                - '*'
              operations:
                - CREATE
                - UPDATE
                - DELETE
              resources:
                - '*'
              scope: Namespaced
            - apiGroups:
                - ''
              apiVersions:
                - '*'
              operations:
                - CONNECT
              resources:
                - pods/exec
                - pods/attach
                - pods/portforward
              scope: Namespaced
        validationActions:
          - Deny
        validations:
          - expression: (request.userInfo.groups.exists(g, g in ['wxops-idp:owners']) || request.userInfo.username in ['alice']) && variables.nsEnv in ['staging', 'prod']
            messageExpression: "'auth.wxops.cloud: ' + variables.nsEnv + ' is a guarded environment \u2014 changes here are for members of persona owners whose environments include it; everyone else goes through Git'"
        variables:
          - expression: 'namespaceObject != null && has(namespaceObject.metadata.labels) && ''wxops.cloud/environment'' in namespaceObject.metadata.labels ? namespaceObject.metadata.labels[''wxops.cloud/environment''] : '''''
            name: nsEnv
  providerConfigRef:
    name: default
