apiVersion: auth.wxops.cloud/v1alpha1
kind: XPersona
metadata:
  name: agents
spec:
  crossplane:
    resourceRefs: []
status:
  conditions:
    - reason: WatchCircuitClosed
      status: 'True'
      type: Responsive
    - reason: ReconcileSuccess
      status: 'True'
      type: Synced
    - reason: Available
      status: 'True'
      type: Ready
  created: true
  environments: []
  groups:
    - wxops-idp:platform
  ready: true
  subjects:
    - apiGroup: rbac.authorization.k8s.io
      kind: Group
      name: wxops-idp:platform
    - apiGroup: rbac.authorization.k8s.io
      kind: User
      name: alice
    - apiGroup: rbac.authorization.k8s.io
      kind: User
      name: bob
    - kind: ServiceAccount
      name: debugger
      namespace: ai-suite
  synced: true
  teams: []
