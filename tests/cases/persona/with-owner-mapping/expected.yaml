apiVersion: auth.wxops.cloud/v1alpha1
kind: XPersona
metadata:
  name: developers
spec:
  crossplane:
    resourceRefs: []
status:
  conditions:
    - reason: WatchCircuitClosed
      status: 'True'
      type: Responsive
    - reason: ReconcileSuccess
      status: 'True'
      type: Synced
    - reason: Available
      status: 'True'
      type: Ready
  created: true
  environments: []
  groups:
    - wxops-idp:checkout
    - wxops-idp:payment
    - wxops-idp:payment-maintainers
  owners:
    - group: wxops-idp:payment-maintainers
      owner: payment
  ready: true
  subjects:
    - apiGroup: rbac.authorization.k8s.io
      kind: Group
      name: wxops-idp:checkout
    - apiGroup: rbac.authorization.k8s.io
      kind: Group
      name: wxops-idp:payment
    - apiGroup: rbac.authorization.k8s.io
      kind: Group
      name: wxops-idp:payment-maintainers
  synced: true
  teams:
    - checkout
    - payment
    - payment-maintainers
