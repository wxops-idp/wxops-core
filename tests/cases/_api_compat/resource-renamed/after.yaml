# expect: breaking resource-removed
#
# A tidy-up rename of the composition-resource-name. Crossplane never sees a
# rename: it deletes app-deployment and creates app-main-deployment, taking the
# running Deployment down with it.
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: app-main-deployment
  name: app-main-deployment
spec:
  forProvider:
    manifest:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
        namespace: tenant
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: app
        template:
          metadata:
            labels:
              app.kubernetes.io/name: app
          spec:
            containers:
              - name: app
                image: app:1.0.0
