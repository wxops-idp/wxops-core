apiVersion: opentofu.upbound.io/v1beta1
kind: Workspace
metadata:
  annotations:
    crossplane.io/composition-resource-name: tf-workspace
  generateName: dex-github-
  labels:
    crossplane.io/composite: dex-github
  name: dex-github-7bf230873e65
  ownerReferences:
    - apiVersion: scm.wxops.cloud/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: XScmOAuthApp
      name: dex-github
      uid: 839aff29-1518-5cbe-bba3-d1c30bf47eba
spec:
  forProvider:
    module: "# GitHub has no API to create an OAuth App, so this module declares no provider at all: an operator\n# registers the application by hand and `observed` mode passes that pair through. With no provider\n# block nothing makes a call to the host.\n\n# \u2500\u2500 From the XScmConnection Secret (varFiles) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# Only vendor is used; the rest are declared because the connection Secret always sets them, and an\n# undeclared variable in a -var-file is a warning this module should not emit.\nvariable \"vendor\" {\n  type = string\n  validation {\n    condition     = var.vendor == \"github\"\n    error_message = \"XScmOAuthApp.spec.parameters.vendor is github, but scmRef's XScmConnection resolves to a different vendor. Fix the mismatch on one side.\"\n  }\n}\nvariable \"base_url\" { type = string\
      \ } # \"\" means github.com\nvariable \"default_org\" { type = string }\nvariable \"access\" {\n  type = string\n  validation {\n    condition     = contains([\"write\", \"read\"], var.access)\n    error_message = \"access must be write or read.\"\n  }\n}\nvariable \"token\" {\n  type      = string\n  sensitive = true\n}\n\n# \u2500\u2500 From the XR \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nvariable \"mode\" {\n  type = string\n  validation {\n    condition     = contains([\"managed\", \"observed\"], var.mode)\n    error_message = \"mode must be managed or observed.\"\n  }\n}\nvariable \"app_name\" { type = string }\nvariable \"redirect_uris\" { type\
      \ = string }\nvariable \"confidential\" { type = bool }\nvariable \"rotation_generation\" { type = string }\n\n# \u2500\u2500 From the operator's Secret (varFiles) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nvariable \"existing_client_id\" {\n  type    = string\n  default = \"\"\n}\nvariable \"existing_client_secret\" {\n  type      = string\n  sensitive = true\n  default   = \"\"\n}\n\n# The rules a schema cannot express, checked before anything is passed through. This resource\n# always exists, so its preconditions always run.\nresource \"terraform_data\" \"guard\" {\n  input = var.vendor\n\n  lifecycle {\n    precondition {\n      condition     = var.mode == \"observed\"\n      error_message = \"mode: managed is only available on Gitea. GitHub has no API to create an OAuth App, so register it by hand and\
      \ use mode: observed with credentialsSecretRef.\"\n    }\n    precondition {\n      condition     = var.existing_client_id != \"\" && var.existing_client_secret != \"\"\n      error_message = \"mode: observed needs credentialsSecretRef to name a Secret whose `credentials` key sets existing_client_id and existing_client_secret in tfvars form.\"\n    }\n  }\n}\n\n# \u2500\u2500 Outputs \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# The same three the Gitea module ends with, so everything after the Workspace is identical.\noutput \"client_id\" {\n  value = var.existing_client_id\n}\n\noutput \"client_secret\" {\n  value     = var.existing_client_secret\n\
      \  sensitive = true\n}\n\noutput \"generation\" {\n  value = var.rotation_generation\n}\n"
    source: Inline
    varFiles:
      - secretKeyRef:
          key: credentials
          name: scm-connection-github-wxops-idp
          namespace: crossplane-system
        source: SecretKey
      - secretKeyRef:
          key: credentials
          name: dex-github-oauth
          namespace: crossplane-system
        source: SecretKey
    vars:
      - key: mode
        value: observed
      - key: app_name
        value: dex
      - key: redirect_uris
        value: https://dex.example.com/callback
      - key: confidential
        value: 'true'
      - key: rotation_generation
        value: '1'
  providerConfigRef:
    name: default
  writeConnectionSecretToRef:
    name: tf-scm-oauth-app-839aff29-1518-5cbe-bba3-d1c30bf47eba
    namespace: crossplane-system
