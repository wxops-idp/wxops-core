apiVersion: auth.wxops.cloud/v1alpha1
kind: XPolicy
metadata:
  name: rbac-guard
spec:
  crossplane:
    resourceRefs:
      - apiVersion: kubernetes.crossplane.io/v1alpha2
        kind: Object
        name: 18bee33b-policy
status:
  conditions:
    - reason: WatchCircuitClosed
      status: 'True'
      type: Responsive
    - reason: ReconcileSuccess
      status: 'True'
      type: Synced
    - message: 'Unready resources: 18bee33b-policy'
      reason: Creating
      status: 'False'
      type: Ready
  created: false
  policyKind: ValidatingPolicy
  policyName: wxops-rbac-guard
  ready: false
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: 18bee33b-policy
  labels:
    crossplane.io/composite: rbac-guard
  name: 18bee33b-policy
  ownerReferences:
    - apiVersion: auth.wxops.cloud/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: XPolicy
      name: rbac-guard
      uid: 18bee33b-4f44-5cb0-8f43-d5c480ae4bfc
spec:
  forProvider:
    manifest:
      apiVersion: policies.kyverno.io/v1
      kind: ValidatingPolicy
      metadata:
        labels:
          auth.wxops.cloud/policy: rbac-guard
          auth.wxops.cloud/template: rbac-guard
          wxops.cloud/managed-by: platform-policy
        name: wxops-rbac-guard
      spec:
        evaluation:
          background:
            enabled: false
        failurePolicy: Fail
        matchConditions:
          - expression: '!request.userInfo.username.startsWith(''system:'') && request.userInfo.groups.exists(g, [''wxops-idp:''].exists(p, g.startsWith(p)))'
            name: scm-user
          - expression: '!(request.userInfo.groups.exists(g, g in [''wxops-idp:platform'']) || request.userInfo.username in [''root''])'
            name: not-exempt
        matchConstraints:
          resourceRules:
            - apiGroups:
                - rbac.authorization.k8s.io
              apiVersions:
                - '*'
              operations:
                - CREATE
                - UPDATE
                - DELETE
              resources:
                - roles
                - rolebindings
                - clusterroles
                - clusterrolebindings
            - apiGroups:
                - auth.wxops.cloud
              apiVersions:
                - '*'
              operations:
                - CREATE
                - UPDATE
                - DELETE
              resources:
                - '*'
        validationActions:
          - Deny
        validations:
          - expression: 'false'
            message: 'auth.wxops.cloud: bindings are written by XPersonaBinding and personas and policies by the platform team, not by hand'
  providerConfigRef:
    name: default
