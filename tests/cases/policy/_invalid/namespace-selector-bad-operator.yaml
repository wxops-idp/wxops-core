kind: XPolicy
metadata:
  name: nope
spec:
  parameters:
    template: exec-guard
    scmOrgs: [wxops-idp]
    namespaceSelector:
      matchExpressions:
        - {key: wxops.cloud/environment, operator: Equals, values: [prod]}
