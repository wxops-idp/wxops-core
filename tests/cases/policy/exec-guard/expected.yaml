apiVersion: auth.wxops.cloud/v1alpha1
kind: XPolicy
metadata:
  name: exec-guard
spec:
  crossplane:
    resourceRefs:
      - apiVersion: kubernetes.crossplane.io/v1alpha2
        kind: Object
        name: 9ff20d14-policy
status:
  conditions:
    - reason: WatchCircuitClosed
      status: 'True'
      type: Responsive
    - reason: ReconcileSuccess
      status: 'True'
      type: Synced
    - message: 'Unready resources: 9ff20d14-policy'
      reason: Creating
      status: 'False'
      type: Ready
  created: false
  policyKind: ValidatingPolicy
  policyName: wxops-exec-guard
  ready: false
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: 9ff20d14-policy
  labels:
    crossplane.io/composite: exec-guard
  name: 9ff20d14-policy
  ownerReferences:
    - apiVersion: auth.wxops.cloud/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: XPolicy
      name: exec-guard
      uid: 9ff20d14-8d01-5163-882a-cf4ef531649a
spec:
  forProvider:
    manifest:
      apiVersion: policies.kyverno.io/v1
      kind: ValidatingPolicy
      metadata:
        labels:
          auth.wxops.cloud/policy: exec-guard
          auth.wxops.cloud/template: exec-guard
          wxops.cloud/managed-by: platform-policy
        name: wxops-exec-guard
      spec:
        evaluation:
          background:
            enabled: false
        failurePolicy: Fail
        matchConditions:
          - expression: '!request.userInfo.username.startsWith(''system:'') && request.userInfo.groups.exists(g, [''wxops-idp:''].exists(p, g.startsWith(p)))'
            name: scm-user
          - expression: '!(request.userInfo.groups.exists(g, g in [''wxops-idp:platform'']) || request.userInfo.username in [''root''])'
            name: not-exempt
        matchConstraints:
          resourceRules:
            - apiGroups:
                - ''
              apiVersions:
                - '*'
              operations:
                - CONNECT
              resources:
                - pods/exec
                - pods/attach
                - pods/portforward
        validationActions:
          - Deny
        validations:
          - expression: (request.userInfo.groups.exists(g, g in ['wxops-idp:owners']) || request.userInfo.username in ['alice']) && variables.nsOwner in variables.teams
            message: 'auth.wxops.cloud: exec, attach and port-forward are for the members of persona ''owners'', in a namespace one of their teams owns'
        variables:
          - expression: request.userInfo.groups.filter(g, ['wxops-idp:'].exists(p, g.startsWith(p))).map(g, g.substring(g.indexOf(':') + 1))
            name: teams
          - expression: 'namespaceObject != null && has(namespaceObject.metadata.labels) && ''wxops.cloud/owner'' in namespaceObject.metadata.labels ? namespaceObject.metadata.labels[''wxops.cloud/owner''] : '''''
            name: nsOwner
  providerConfigRef:
    name: default
