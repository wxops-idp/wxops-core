apiVersion: tenant.wxops.cloud/v1alpha1
kind: XApp
metadata:
  name: payment-api-prod
  namespace: rocket-team-production
spec:
  crossplane:
    resourceRefs:
      - apiVersion: kubernetes.m.crossplane.io/v1alpha1
        kind: Object
        name: payment-api-deployment
      - apiVersion: kubernetes.m.crossplane.io/v1alpha1
        kind: Object
        name: payment-api-service
status:
  conditions:
    - reason: WatchCircuitClosed
      status: 'True'
      type: Responsive
    - reason: ReconcileSuccess
      status: 'True'
      type: Synced
    - message: 'Unready resources: payment-api-deployment, payment-api-service'
      reason: Creating
      status: 'False'
      type: Ready
  created: false
  dependenciesReady: true
  image: ghcr.io/rocket-team/payment-api:1.4.0
  namespace: rocket-team-production
  owner: rocket-team
  ready: false
  url: ''
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: payment-api-deployment
  labels:
    crossplane.io/composite: payment-api-prod
  name: payment-api-deployment
  namespace: rocket-team-production
  ownerReferences:
    - apiVersion: tenant.wxops.cloud/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: XApp
      name: payment-api-prod
      uid: fe5f33b6-ce27-5173-a4f8-bbb0d2e0042a
spec:
  forProvider:
    manifest:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        annotations: {}
        labels:
          app.kubernetes.io/component: app
          app.kubernetes.io/instance: payment-api
          app.kubernetes.io/managed-by: crossplane
          app.kubernetes.io/name: payment-api
          wxops.cloud/app-flavor: webapp
          wxops.cloud/environment: dev
          wxops.cloud/owner: rocket-team
        name: payment-api
        namespace: rocket-team-production
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/component: app
            app.kubernetes.io/instance: payment-api
            app.kubernetes.io/name: payment-api
        strategy:
          rollingUpdate:
            maxSurge: 25%
            maxUnavailable: 25%
          type: RollingUpdate
        template:
          metadata:
            annotations: {}
            labels:
              app.kubernetes.io/component: app
              app.kubernetes.io/instance: payment-api
              app.kubernetes.io/managed-by: crossplane
              app.kubernetes.io/name: payment-api
              wxops.cloud/app-flavor: webapp
              wxops.cloud/environment: dev
          spec:
            containers:
              - env: []
                image: ghcr.io/rocket-team/payment-api:1.4.0
                imagePullPolicy: IfNotPresent
                livenessProbe:
                  failureThreshold: 3
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                name: payment-api
                ports:
                  - containerPort: 8080
                readinessProbe:
                  failureThreshold: 3
                  httpGet:
                    path: /readyz
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 1
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: payment-api-service
  labels:
    crossplane.io/composite: payment-api-prod
  name: payment-api-service
  namespace: rocket-team-production
  ownerReferences:
    - apiVersion: tenant.wxops.cloud/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: XApp
      name: payment-api-prod
      uid: fe5f33b6-ce27-5173-a4f8-bbb0d2e0042a
spec:
  forProvider:
    manifest:
      apiVersion: v1
      kind: Service
      metadata:
        annotations: {}
        labels:
          app.kubernetes.io/component: app
          app.kubernetes.io/instance: payment-api
          app.kubernetes.io/managed-by: crossplane
          app.kubernetes.io/name: payment-api
          wxops.cloud/app-flavor: webapp
          wxops.cloud/environment: dev
          wxops.cloud/owner: rocket-team
        name: payment-api
        namespace: rocket-team-production
      spec:
        ports:
          - port: 80
            targetPort: 8080
        selector:
          app.kubernetes.io/component: app
          app.kubernetes.io/instance: payment-api
          app.kubernetes.io/name: payment-api
        type: ClusterIP
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
