      uid: fbd3b9f8-094f-5e59-aed2-1bf0a6a9774d
spec:
  forProvider:
    manifest:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        annotations: {}
        labels:
          app.kubernetes.io/component: app
          app.kubernetes.io/instance: payment-api
          app.kubernetes.io/managed-by: crossplane
          app.kubernetes.io/name: payment-api
          wxops.cloud/app-flavor: webapp
          wxops.cloud/environment: dev
          wxops.cloud/owner: rocket-team
        name: payment-api-tls
        namespace: rocket-team-production
      spec:
        dnsNames:
          - payment-api.rocket-team.example.com
        issuerRef:
          kind: ClusterIssuer
          name: letsencrypt-prod
        secretName: payment-api-tls
  managementPolicies:
