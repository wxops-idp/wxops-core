# Mocked observed state of the Terraform Workspace this composition creates.
#
# provider-terraform publishes non-sensitive outputs under
# status.atProvider.outputs, and only after `terraform apply` has succeeded and
# written state. Their presence is what drives status.created / status.ready.
#
# Sensitive outputs (e.g. gitea-user's initial_password) are routed to the
# connection secret and never appear here — that is exactly why no patch reads
# them into status.
apiVersion: tf.upbound.io/v1beta1
kind: Workspace
metadata:
  annotations:
    crossplane.io/composition-resource-name: tf-workspace
  name: tf-workspace
status:
  atProvider:
    outputs:
      org_id: '7'
      org_name: rocket-team
  conditions:
    - reason: Available
      status: 'True'
      type: Ready
    - reason: ReconcileSuccess
      status: 'True'
      type: Synced
