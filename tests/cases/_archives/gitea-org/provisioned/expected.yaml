apiVersion: platform.wxops.cloud/v1alpha1
kind: XGiteaOrg
metadata:
  name: team-alpha
spec:
  crossplane:
    resourceRefs:
      - apiVersion: tf.upbound.io/v1beta1
        kind: Workspace
        name: tf-workspace
status:
  conditions:
    - reason: WatchCircuitClosed
      status: 'True'
      type: Responsive
    - reason: ReconcileSuccess
      status: 'True'
      type: Synced
    - reason: Available
      status: 'True'
      type: Ready
  created: true
  orgId: '7'
  orgName: rocket-team
  ready: true
---
apiVersion: tf.upbound.io/v1beta1
kind: Workspace
metadata:
  annotations:
    crossplane.io/composition-resource-name: tf-workspace
  labels:
    crossplane.io/composite: team-alpha
  name: tf-workspace
  ownerReferences:
    - apiVersion: platform.wxops.cloud/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: XGiteaOrg
      name: team-alpha
      uid: d716698f-18b2-5967-90c4-eda3bce3cc2f
spec:
  forProvider:
    module: "terraform {\n  required_providers {\n    gitea = {\n      source  = \"go-gitea/gitea\"\n      version = \"~> 0.7.0\"\n    }\n  }\n}\n\nvariable \"gitea_url\" { type = string }\nvariable \"insecure\" {\n  type    = bool\n  default = false\n}\nvariable \"org_name\" { type = string }\nvariable \"full_name\" {\n  type    = string\n  default = \"\"\n}\nvariable \"description\" {\n  type    = string\n  default = \"\"\n}\nvariable \"website\" {\n  type    = string\n  default = \"\"\n}\nvariable \"location\" {\n  type    = string\n  default = \"\"\n}\nvariable \"visibility\" {\n  type    = string\n  default = \"public\"\n}\nvariable \"repo_admin_change_team_access\" {\n  type    = bool\n  default = false\n}\n\nvariable \"gitea_token\" {\n  type      = string\n  sensitive = true\n}\n\nprovider \"gitea\" {\n  base_url = var.gitea_url\n  token    = var.gitea_token\n  insecure = var.insecure\n}\n\nresource \"gitea_org\" \"this\" {\n  name                          = var.org_name\n  full_name\
      \                     = var.full_name\n  description                   = var.description\n  website                       = var.website\n  location                      = var.location\n  visibility                    = var.visibility\n  repo_admin_change_team_access = var.repo_admin_change_team_access\n}\n\noutput \"org_id\"   { value = gitea_org.this.id }\noutput \"org_name\" { value = gitea_org.this.name }\n"
    source: Inline
    varFiles:
      - secretKeyRef:
          key: credentials
          name: gitea-credentials
          namespace: crossplane-system
        source: SecretKey
    vars:
      - key: gitea_url
        value: https://gitea.example.com
      - key: org_name
        value: team-alpha
      - key: full_name
        value: Team Alpha
      - key: description
        value: Alpha product squad
      - key: website
        value: ''
      - key: location
        value: ''
      - key: visibility
        value: private
      - key: insecure
        value: 'false'
      - key: repo_admin_change_team_access
        value: 'false'
  providerConfigRef:
    name: default
  writeConnectionSecretToRef:
    name: tf-gitea-org-d716698f-18b2-5967-90c4-eda3bce3cc2f
    namespace: crossplane-system
