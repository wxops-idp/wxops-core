apiVersion: platform.wxops.cloud/v1alpha1
kind: XGiteaUser
metadata:
  name: example-gitea-user
spec:
  crossplane:
    resourceRefs:
      - apiVersion: tf.upbound.io/v1beta1
        kind: Workspace
        name: tf-workspace
status:
  conditions:
    - reason: WatchCircuitClosed
      status: 'True'
      type: Responsive
    - reason: ReconcileSuccess
      status: 'True'
      type: Synced
    - reason: Available
      status: 'True'
      type: Ready
  created: true
  ready: true
  userId: '42'
  username: alice
---
apiVersion: tf.upbound.io/v1beta1
kind: Workspace
metadata:
  annotations:
    crossplane.io/composition-resource-name: tf-workspace
  labels:
    crossplane.io/composite: example-gitea-user
  name: tf-workspace
  ownerReferences:
    - apiVersion: platform.wxops.cloud/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: XGiteaUser
      name: example-gitea-user
      uid: 45bca0c7-8e81-524a-a829-f5e5bfd155a8
spec:
  forProvider:
    module: "terraform {\n  required_providers {\n    random = {\n      source  = \"hashicorp/random\"\n      version = \"~> 3.6\"\n    }\n    gitea = {\n      source  = \"go-gitea/gitea\"\n      version = \"~> 0.7.0\"\n    }\n  }\n}\n\nvariable \"gitea_url\" { type = string }\nvariable \"insecure\" {\n  type    = bool\n  default = false\n}\nvariable \"username\" { type = string }\nvariable \"email\"    { type = string }\nvariable \"full_name\" {\n  type    = string\n  default = \"\"\n}\nvariable \"admin\" {\n  type    = bool\n  default = false\n}\nvariable \"must_change_password\" {\n  type    = bool\n  default = true\n}\nvariable \"password_length\" {\n  type    = number\n  default = 24\n}\nvariable \"password_special\" {\n  type    = bool\n  default = true\n}\nvariable \"visibility\" {\n  type    = string\n  default = \"private\"\n}\nvariable \"allow_create_organization\" {\n  type    = bool\n  default = false\n}\n\nvariable \"gitea_token\" {\n  type      = string\n  sensitive = true\n\
      }\n\nprovider \"gitea\" {\n  base_url = var.gitea_url\n  token    = var.gitea_token\n  insecure = var.insecure\n}\n\nresource \"random_password\" \"initial\" {\n  length           = var.password_length\n  special          = var.password_special\n  override_special = \"!@#$%^&*\"\n}\n\nresource \"gitea_user\" \"this\" {\n  username                  = var.username\n  login_name                = var.username\n  email                     = var.email\n  password                  = random_password.initial.result\n  full_name                 = var.full_name\n  admin                     = var.admin\n  must_change_password      = var.must_change_password\n  visibility                = var.visibility\n  allow_create_organization = var.allow_create_organization\n  # Requires a working SMTP server configured in Gitea.\n  # Sends a welcome email with login credentials on account creation.\n  send_notification         = true\n}\n\noutput \"user_id\"  { value = gitea_user.this.id }\noutput \"username\"\
      \ { value = gitea_user.this.username }\noutput \"initial_password\" {\n  value     = random_password.initial.result\n  sensitive = true\n}\n"
    source: Inline
    varFiles:
      - secretKeyRef:
          key: credentials
          name: gitea-credentials
          namespace: crossplane-system
        source: SecretKey
    vars:
      - key: gitea_url
        value: https://gitea.example.com
      - key: username
        value: alice
      - key: email
        value: alice@example.com
      - key: full_name
        value: Alice
      - key: admin
        value: 'false'
      - key: must_change_password
        value: 'true'
      - key: insecure
        value: 'false'
      - key: password_length
        value: '24'
      - key: password_special
        value: 'true'
      - key: visibility
        value: private
      - key: allow_create_organization
        value: 'false'
  providerConfigRef:
    name: default
  writeConnectionSecretToRef:
    name: tf-gitea-user-45bca0c7-8e81-524a-a829-f5e5bfd155a8
    namespace: crossplane-system
