# expect: passwordLength
# expect: minimum
#
# The generated initial password is emailed to the user. A floor of 16 chars is a
# security control, not a preference.
apiVersion: platform.wxops.cloud/v1alpha1
kind: XGiteaUser
metadata:
  name: weak-pw
spec:
  parameters:
    giteaUrl: https://gitea.example.com
    username: alice
    email: alice@example.com
    passwordLength: 8
    credentialsSecretRef:
      name: gitea-admin
      namespace: crossplane-system
