apiVersion: platform.wxops.cloud/v1alpha1
kind: XTenantApp
metadata:
  name: rocket-team-payment-api
spec:
  crossplane:
    resourceRefs:
      - apiVersion: kubernetes.crossplane.io/v1alpha2
        kind: Object
        name: payment-api-deployment
      - apiVersion: kubernetes.crossplane.io/v1alpha2
        kind: Object
        name: payment-api-podmonitor
status:
  conditions:
    - reason: WatchCircuitClosed
      status: 'True'
      type: Responsive
    - reason: ReconcileSuccess
      status: 'True'
      type: Synced
    - message: 'Unready resources: payment-api-deployment, payment-api-podmonitor'
      reason: Creating
      status: 'False'
      type: Ready
  created: false
  dependenciesReady: true
  image: ghcr.io/rocket-team/payment-api:1.4.0
  namespace: rocket-team-production
  ready: false
  url: ''
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: payment-api-deployment
  labels:
    crossplane.io/composite: rocket-team-payment-api
  name: payment-api-deployment
  ownerReferences:
    - apiVersion: platform.wxops.cloud/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: XTenantApp
      name: rocket-team-payment-api
      uid: c66e5e9b-320c-5b1b-8beb-cf16e380a850
spec:
  forProvider:
    manifest:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        annotations: {}
        labels:
          app.kubernetes.io/component: app
          app.kubernetes.io/instance: payment-api
          app.kubernetes.io/managed-by: crossplane
          app.kubernetes.io/name: payment-api
          wxops.cloud/app-flavor: webapp
          wxops.cloud/environment: dev
        name: payment-api
        namespace: rocket-team-production
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/component: app
            app.kubernetes.io/instance: payment-api
            app.kubernetes.io/name: payment-api
        strategy:
          rollingUpdate:
            maxSurge: 25%
            maxUnavailable: 25%
          type: RollingUpdate
        template:
          metadata:
            annotations: {}
            labels:
              app.kubernetes.io/component: app
              app.kubernetes.io/instance: payment-api
              app.kubernetes.io/managed-by: crossplane
              app.kubernetes.io/name: payment-api
              wxops.cloud/app-flavor: webapp
              wxops.cloud/environment: dev
          spec:
            containers:
              - env: []
                image: ghcr.io/rocket-team/payment-api:1.4.0
                imagePullPolicy: IfNotPresent
                name: payment-api
                ports:
                  - containerPort: 8080
  providerConfigRef:
    name: default
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: payment-api-podmonitor
  labels:
    crossplane.io/composite: rocket-team-payment-api
  name: payment-api-podmonitor
  ownerReferences:
    - apiVersion: platform.wxops.cloud/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: XTenantApp
      name: rocket-team-payment-api
      uid: c66e5e9b-320c-5b1b-8beb-cf16e380a850
spec:
  forProvider:
    manifest:
      apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        annotations: {}
        labels:
          app.kubernetes.io/component: app
          app.kubernetes.io/instance: payment-api
          app.kubernetes.io/managed-by: crossplane
          app.kubernetes.io/name: payment-api
          release: kube-prometheus-stack
          wxops.cloud/app-flavor: webapp
          wxops.cloud/environment: dev
        name: payment-api
        namespace: rocket-team-production
      spec:
        namespaceSelector:
          matchNames:
            - rocket-team-production
        podMetricsEndpoints:
          - honorLabels: false
            interval: 30s
            path: /metrics
            scrapeTimeout: 10s
            targetPort: 8080
        sampleLimit: 5000
        selector:
          matchLabels:
            app.kubernetes.io/component: app
            app.kubernetes.io/instance: payment-api
            app.kubernetes.io/name: payment-api
  providerConfigRef:
    name: default
