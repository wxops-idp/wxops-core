apiVersion: auth.wxops.cloud/v1alpha1
kind: XPlatformPolicy
metadata:
  name: handover
spec:
  crossplane:
    resourceRefs:
      - apiVersion: kubernetes.crossplane.io/v1alpha2
        kind: Object
        name: dca4f9cc-policy
status:
  conditions:
    - reason: WatchCircuitClosed
      status: 'True'
      type: Responsive
    - reason: ReconcileSuccess
      status: 'True'
      type: Synced
    - message: 'Unready resources: dca4f9cc-policy'
      reason: Creating
      status: 'False'
      type: Ready
  created: false
  policyKind: ValidatingPolicy
  policyName: wxops-handover
  ready: false
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: dca4f9cc-policy
  labels:
    crossplane.io/composite: handover
  name: dca4f9cc-policy
  ownerReferences:
    - apiVersion: auth.wxops.cloud/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: XPlatformPolicy
      name: handover
      uid: dca4f9cc-9b80-5f58-94b5-f5cdf9224dd3
spec:
  deletionPolicy: Orphan
  forProvider:
    manifest:
      apiVersion: policies.kyverno.io/v1
      kind: ValidatingPolicy
      metadata:
        labels:
          auth.wxops.cloud/policy: handover
          auth.wxops.cloud/template: protected
          wxops.cloud/managed-by: platform-policy
        name: wxops-handover
      spec:
        evaluation:
          background:
            enabled: false
        failurePolicy: Fail
        matchConditions:
          - expression: '!(request.resource.group in [''authentication.k8s.io'', ''authorization.k8s.io'', ''login.concierge.pinniped.dev'', ''identity.concierge.pinniped.dev'']) && !(request.resource.resource in [''events'', ''leases''])'
            name: not-excluded
          - expression: '!request.userInfo.username.startsWith(''system:'') && request.userInfo.groups.exists(g, [''wxops-idp:''].exists(p, g.startsWith(p)))'
            name: scm-user
          - expression: '!(request.userInfo.groups.exists(g, g in [''wxops-idp:platform'']) || request.userInfo.username in [''root''])'
            name: not-exempt
        matchConstraints:
          excludeResourceRules:
            - apiGroups:
                - authentication.k8s.io
                - authorization.k8s.io
                - login.concierge.pinniped.dev
                - identity.concierge.pinniped.dev
              apiVersions:
                - '*'
              operations:
                - '*'
              resources:
                - '*'
            - apiGroups:
                - ''
                - events.k8s.io
              apiVersions:
                - '*'
              operations:
                - '*'
              resources:
                - events
            - apiGroups:
                - coordination.k8s.io
              apiVersions:
                - '*'
              operations:
                - '*'
              resources:
                - leases
          resourceRules:
            - apiGroups:
                - '*'
              apiVersions:
                - '*'
              operations:
                - UPDATE
                - DELETE
              resources:
                - '*'
        validationActions:
          - Deny
        validations:
          - expression: '!(has(oldObject.metadata.labels) && ''wxops.cloud/protected'' in oldObject.metadata.labels && oldObject.metadata.labels[''wxops.cloud/protected''] == ''true'')'
            message: "auth.wxops.cloud: this object is protected (wxops.cloud/protected) \u2014 the platform team changes it"
  managementPolicies:
    - Observe
  providerConfigRef:
    name: default
