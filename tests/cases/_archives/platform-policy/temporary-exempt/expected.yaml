                - authorization.k8s.io
                - login.concierge.pinniped.dev
                - identity.concierge.pinniped.dev
              apiVersions:
                - '*'
              operations:
                - '*'
              resources:
                - '*'
            - apiGroups:
                - ''
                - events.k8s.io
              apiVersions:
                - '*'
              operations:
                - '*'
              resources:
                - events
            - apiGroups:
                - coordination.k8s.io
              apiVersions:
                - '*'
              operations:
                - '*'
              resources:
                - leases
          resourceRules:
            - apiGroups:
                - '*'
              apiVersions:
                - '*'
              operations:
                - UPDATE
                - DELETE
              resources:
                - '*'
        validationActions:
          - Deny
        validations:
          - expression: ((request.userInfo.groups.exists(g, g in []) || request.userInfo.username in ['alice']) && time.now() < timestamp('2026-12-01T00:00:00Z')) || (!(has(oldObject.metadata.labels) && 'wxops.cloud/protected' in oldObject.metadata.labels && oldObject.metadata.labels['wxops.cloud/protected'] == 'true'))
