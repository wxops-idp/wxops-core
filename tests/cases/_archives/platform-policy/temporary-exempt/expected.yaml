          auth.wxops.cloud/policy: temporary-exempt
          auth.wxops.cloud/template: protected
          wxops.cloud/managed-by: platform-policy
        name: wxops-temporary-exempt
      spec:
        evaluation:
          background:
            enabled: false
        failurePolicy: Fail
        matchConditions:
          - expression: '!(request.resource.group in [''authentication.k8s.io'', ''authorization.k8s.io'', ''login.concierge.pinniped.dev'', ''identity.concierge.pinniped.dev'']) && !(request.resource.resource in [''events'', ''leases''])'
            name: not-excluded
          - expression: '!request.userInfo.username.startsWith(''system:'') && request.userInfo.groups.exists(g, [''wxops-idp:''].exists(p, g.startsWith(p)))'
            name: scm-user
          - expression: '!(request.userInfo.groups.exists(g, g in [''wxops-idp:platform'']) || request.userInfo.username in [])'
