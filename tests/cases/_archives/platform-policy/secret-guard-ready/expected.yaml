apiVersion: auth.wxops.cloud/v1alpha1
kind: XPlatformPolicy
metadata:
  name: secret-guard
spec:
  crossplane:
    resourceRefs:
      - apiVersion: kubernetes.crossplane.io/v1alpha2
        kind: Object
        name: 6867a401-policy
status:
  conditions:
    - reason: WatchCircuitClosed
      status: 'True'
      type: Responsive
    - reason: ReconcileSuccess
      status: 'True'
      type: Synced
    - reason: Available
      status: 'True'
      type: Ready
  created: true
  policyKind: ValidatingPolicy
  policyName: wxops-secret-guard
  ready: true
  synced: true
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: 6867a401-policy
  labels:
    crossplane.io/composite: secret-guard
  name: 6867a401-policy
  ownerReferences:
    - apiVersion: auth.wxops.cloud/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: XPlatformPolicy
      name: secret-guard
      uid: 6867a401-57c8-5dff-b52d-94f97031f419
spec:
  forProvider:
    manifest:
      apiVersion: policies.kyverno.io/v1
      kind: ValidatingPolicy
      metadata:
        labels:
          auth.wxops.cloud/policy: secret-guard
          auth.wxops.cloud/template: secret-guard
          wxops.cloud/managed-by: platform-policy
        name: wxops-secret-guard
      spec:
        evaluation:
          background:
            enabled: false
        failurePolicy: Fail
        matchConditions:
          - expression: '!request.userInfo.username.startsWith(''system:'') && request.userInfo.groups.exists(g, [''wxops-idp:''].exists(p, g.startsWith(p)))'
            name: scm-user
        matchConstraints:
          resourceRules:
            - apiGroups:
                - ''
              apiVersions:
                - '*'
              operations:
                - CREATE
                - UPDATE
                - DELETE
              resources:
                - secrets
        validationActions:
          - Deny
        validations:
          - expression: 'false'
            message: 'auth.wxops.cloud: Secrets are written by External Secrets Operator from OpenBao, not by hand'
  providerConfigRef:
    name: default
