# Handed over (ADR-005): env-gate composes two policies — the namespace gate and the application gate — and both Objects must stop writing and orphan on delete.
# env-gate: in namespaces labelled wxops.cloud/environment: prod, only members of `owners` whose environments include prod write or exec.
apiVersion: auth.wxops.cloud/v1alpha1
kind: XPlatformPolicy
metadata:
  name: env-gate
  annotations:
    wxops.cloud/handover: "true"
spec:
  parameters:
    template: env-gate
    scmOrgs: [wxops-idp]
    environments: [prod]
    personaRef:
      name: owners
    exemptPersonaRef:
      name: platform
