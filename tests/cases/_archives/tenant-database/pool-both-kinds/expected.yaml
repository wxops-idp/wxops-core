      spec:
        dataFrom:
          - sourceRef:
              generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                name: rocket-team-payment-db-pwd-gen
        refreshInterval: '0'
        refreshPolicy: CreatedOnce
        target:
          creationPolicy: Owner
          deletionPolicy: Retain
          name: rocket-team-payment-db-connection-creds
          template:
            data:
              connectionString: postgresql://rocket-team-payment-db:{{ .password }}@cluster-b-rw.cnpg-other.svc.cluster.local:5432/payment-db
              database: payment-db
              endpoint: cluster-b-rw.cnpg-other.svc.cluster.local
              password: '{{ .password }}'
              port: '5432'
              username: rocket-team-payment-db
            engineVersion: v2
