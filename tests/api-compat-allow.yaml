# tests/api-compat-allow.yaml — deliberate breaking changes for the NEXT release.
#
# tests/api_compat.py fails on any breaking change to an API that has already
# been released: a removed or retyped field, a new required field, a narrowed
# enum, a composed resource that would be deleted, a changed immutable field.
# When the break is deliberate, list it here so the PR diff puts it in front of
# a reviewer. Copy package/rule/path exactly from the api_compat output:
#
#   - package: tenant-app
#     rule: property-removed
#     path: v1alpha1.spec.parameters.oldField
#     reason: Replaced by newField; no XR in any cluster sets it (checked with kubectl).
#
# An entry without a reason is ignored. `make release` requires release notes
# while any entry is in use and clears this list in the release commit — an
# allowance covers one release, never a standing exemption.
allow:
  - package: scm-oauth-app
    rule: required-added
    path: v1alpha1.spec.parameters.vendor
    reason: "Module selection needs the vendor before the connection's Secret is read, as on scm-repository and scm-team. A first version defaulted it to gitea, but on a real cluster Crossplane rendered an existing XR without the defaulted value and the Workspace ran the literal placeholder module. The only existing XR in a cluster is dex-gitea, which gets vendor: gitea added (checked with kubectl)."
  - package: scm-oauth-app
    rule: replay-invalid
    path: tests/cases/scm-oauth-app/gitea-managed/xr.yaml
    reason: "Module selection needs the vendor before the connection's Secret is read, as on scm-repository and scm-team. A first version defaulted it to gitea, but on a real cluster Crossplane rendered an existing XR without the defaulted value and the Workspace ran the literal placeholder module. The only existing XR in a cluster is dex-gitea, which gets vendor: gitea added (checked with kubectl)."
  - package: scm-oauth-app
    rule: replay-invalid
    path: tests/cases/scm-oauth-app/gitea-tenant-path/xr.yaml
    reason: "Module selection needs the vendor before the connection's Secret is read, as on scm-repository and scm-team. A first version defaulted it to gitea, but on a real cluster Crossplane rendered an existing XR without the defaulted value and the Workspace ran the literal placeholder module. The only existing XR in a cluster is dex-gitea, which gets vendor: gitea added (checked with kubectl)."
  - package: scm-oauth-app
    rule: replay-invalid
    path: tests/cases/scm-oauth-app/github-observed/xr.yaml
    reason: "Module selection needs the vendor before the connection's Secret is read, as on scm-repository and scm-team. A first version defaulted it to gitea, but on a real cluster Crossplane rendered an existing XR without the defaulted value and the Workspace ran the literal placeholder module. The only existing XR in a cluster is dex-gitea, which gets vendor: gitea added (checked with kubectl)."
  - package: scm-oauth-app
    rule: replay-invalid
    path: examples/scm-oauth-app/github-observed.yaml
    reason: "Module selection needs the vendor before the connection's Secret is read, as on scm-repository and scm-team. A first version defaulted it to gitea, but on a real cluster Crossplane rendered an existing XR without the defaulted value and the Workspace ran the literal placeholder module. The only existing XR in a cluster is dex-gitea, which gets vendor: gitea added (checked with kubectl)."
  - package: scm-oauth-app
    rule: replay-invalid
    path: examples/scm-oauth-app/xr.yaml
    reason: "Module selection needs the vendor before the connection's Secret is read, as on scm-repository and scm-team. A first version defaulted it to gitea, but on a real cluster Crossplane rendered an existing XR without the defaulted value and the Workspace ran the literal placeholder module. The only existing XR in a cluster is dex-gitea, which gets vendor: gitea added (checked with kubectl)."
