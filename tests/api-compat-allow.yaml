# tests/api-compat-allow.yaml — deliberate breaking changes for the NEXT release.
#
# tests/api_compat.py fails on any breaking change to an API that has already
# been released: a removed or retyped field, a new required field, a narrowed
# enum, a composed resource that would be deleted, a changed immutable field.
# When the break is deliberate, list it here so the PR diff puts it in front of
# a reviewer. Copy package/rule/path exactly from the api_compat output:
#
#   - package: tenant-app
#     rule: property-removed
#     path: v1alpha1.spec.parameters.oldField
#     reason: Replaced by newField; no XR in any cluster sets it (checked with kubectl).
#
# An entry without a reason is ignored. `make release` requires release notes
# while any entry is in use and clears this list in the release commit — an
# allowance covers one release, never a standing exemption.
allow:
  - package: persona-binding
    rule: enum-narrowed
    path: v1alpha1.spec.parameters.role
    reason: >-
      The built-in `view` is no longer bindable — `wxops:persona-viewers` is `view` plus the pieces the platform adds for viewers, so it replaces it.
      No example, test or doc binds `view`; check live clusters before upgrading (an XPersonaBinding with `role: view` stops validating):
      kubectl get xpersonabindings -o jsonpath='{range .items[*]}{.metadata.name} {.spec.parameters.role}{"\n"}{end}' | grep -w view
  - package: platform-policy
    rule: enum-narrowed
    path: v1alpha1.spec.parameters.template
    reason: >-
      Template renamed secret-readonly → secret-guard: the old name read as "people may read Secrets", while the rule only refuses writes (Secrets come from External Secrets Operator; teams read values in OpenBao). The rendered Kyverno policy is named after the XR, so enforcement is not interrupted. Before upgrading, switch every XPlatformPolicy using it: kubectl get xplatformpolicies -o jsonpath='{range .items[*]}{.metadata.name} {.spec.parameters.template}{"\n"}{end}' | grep -w secret-readonly
  - package: platform-policy
    rule: replay-invalid
    path: tests/cases/platform-policy/secret-readonly/xr.yaml
    reason: >-
      Template renamed secret-readonly → secret-guard: the old name read as "people may read Secrets", while the rule only refuses writes (Secrets come from External Secrets Operator; teams read values in OpenBao). The rendered Kyverno policy is named after the XR, so enforcement is not interrupted. Before upgrading, switch every XPlatformPolicy using it: kubectl get xplatformpolicies -o jsonpath='{range .items[*]}{.metadata.name} {.spec.parameters.template}{"\n"}{end}' | grep -w secret-readonly
  - package: platform-policy
    rule: replay-invalid
    path: tests/cases/platform-policy/secret-readonly-ready/xr.yaml
    reason: >-
      Template renamed secret-readonly → secret-guard: the old name read as "people may read Secrets", while the rule only refuses writes (Secrets come from External Secrets Operator; teams read values in OpenBao). The rendered Kyverno policy is named after the XR, so enforcement is not interrupted. Before upgrading, switch every XPlatformPolicy using it: kubectl get xplatformpolicies -o jsonpath='{range .items[*]}{.metadata.name} {.spec.parameters.template}{"\n"}{end}' | grep -w secret-readonly
  - package: platform-policy
    rule: replay-invalid
    path: tests/cases/platform-policy/secret-readonly-sync-failed/xr.yaml
    reason: >-
      Template renamed secret-readonly → secret-guard: the old name read as "people may read Secrets", while the rule only refuses writes (Secrets come from External Secrets Operator; teams read values in OpenBao). The rendered Kyverno policy is named after the XR, so enforcement is not interrupted. Before upgrading, switch every XPlatformPolicy using it: kubectl get xplatformpolicies -o jsonpath='{range .items[*]}{.metadata.name} {.spec.parameters.template}{"\n"}{end}' | grep -w secret-readonly
