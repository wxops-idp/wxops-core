name: Validate

# The merge gate for GitHub-side pull requests. Mirrors
# .gitea/workflows/pr-validate.yaml — same checks, same order, kept in sync by
# hand since Gitea and GitHub Actions do not share a workflow file.
#
# Gitea was primary through v0.4.0; GitHub is primary from the first
# date-named release, Gitea archived. A PR opened here needs its own gate
# regardless — nothing else validates a GitHub-side PR.
#
# PR-only, deliberately: this does not also run on push to main. A merge into
# main is only reachable through a PR that already passed this gate, so a
# second run there would just repeat the same checks against the same commit.
on:
  pull_request:
    branches: [main]

# A force-push or a rebase makes in-flight runs irrelevant; do not pay for them.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFORM_VERSION: v0.7.0
  # Keep in sync with CRDS_CATALOG_REF in the Makefile. Pinned so upstream cannot
  # change what CI accepts without a commit in this repo.
  CRDS_CATALOG_REF: 52b0261318acc7dd0b66e032759b1f218216b980

jobs:
  # ── Fast, no Docker: fails in seconds on the cheap mistakes ────────────────
  static:
    name: Lint and schema
    runs-on: ubuntu-latest
    steps:
      # Full history: the API compatibility check compares against the last
      # release tag, and a shallow clone has no tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          # A venv, not a bare `pip install`, matches the local-dev convention
          # already documented in CLAUDE.md/CONTRIBUTING.md (~/.python3-venv) and
          # sidesteps PEP 668's externally-managed-environment block regardless of
          # what the runner's base image does with its own system Python — no
          # dependency on guessing why a bare install might fail.
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/pip install --quiet yamllint -r tests/requirements.txt
          curl -sSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      - name: yamllint
        run: yamllint -c .yamllint.yaml .

      - name: kubeconform (package/)
        run: |
          find package/ -name '*.yaml' | xargs kubeconform \
            -schema-location default \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRDS_CATALOG_REF}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            -ignore-missing-schemas -summary

      # Strict against our own XRDs. Needs no Docker, so it runs here and gives
      # the fastest possible signal on an API-contract break.
      - name: XRD conformance
        run: python3 tests/xrd.py

      # A released XRD is additive-only — Crossplane has no conversion between
      # versions, so a new API version cannot absorb a breaking change. Also
      # replays released XRs and checks goldens for deleted resources and
      # changed immutable fields. No Docker, so it runs here.
      - name: API compatibility vs last release
        run: |
          python3 tests/api_compat.py
          python3 tests/api_compat.py --self-test

  # ── Package integrity ──────────────────────────────────────────────────────
  packages:
    name: Build and KCL sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/crossplane
          crossplane version --client

      # kcl-sync.py imports tests/lib/packages.py (the one package resolver, shared with the
      # test suite) to find each package's path from VERSIONS.yaml, which needs PyYAML.
      - name: Install Python deps
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/pip install --quiet -r tests/requirements.txt

      # kcl/<pkg>/main.k is the single source of truth and is embedded into
      # composition.yaml by `make kcl-sync`. Only the Configuration directory is
      # packaged, so drift means the published package does not match the source
      # that was reviewed.
      - name: KCL sync check
        run: make kcl-check

      - name: xpkg build (all packages)
        run: bash .gitea/scripts/validate-packages.sh

  # ── The composition test suite ─────────────────────────────────────────────
  # Slowest job: `crossplane composition render` runs each function as a Docker
  # container, and the images total roughly 800MB (function-kcl alone is ~550MB).
  # They are cached between runs so only the first run after a version bump pays
  # the full pull.
  compositions:
    name: Composition tests
    runs-on: ubuntu-latest
    # Gated behind the cheap checks: this job pulls ~800MB of function images
    # and takes minutes even on a cache hit. No reason to pay that cost when
    # lint or a package build already failed — those fail in seconds.
    needs: [static, packages]
    steps:
      # Full history: `make test` includes test-api-compat, which needs tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Install Python deps
        run: |
          # A venv, not a bare `pip install`, matches the local-dev convention
          # already documented in CLAUDE.md/CONTRIBUTING.md (~/.python3-venv) and
          # sidesteps PEP 668's externally-managed-environment block regardless of
          # what the runner's base image does with its own system Python — no
          # dependency on guessing why a bare install might fail.
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/pip install --quiet -r tests/requirements.txt

      - name: Resolve function image digests
        id: fns
        run: |
          # Cache key derived from the pinned function versions, so a version bump
          # invalidates the cache and anything else reuses it.
          printf 'key=%s\n' \
            "$(cat providers/function-*.yaml | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore function image cache
        id: imgcache
        uses: actions/cache@v4
        with:
          path: /tmp/fn-images.tar
          key: crossplane-fn-images-${{ steps.fns.outputs.key }}

      - name: Load cached function images
        if: steps.imgcache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/fn-images.tar

      - name: Pull function images
        if: steps.imgcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          imgs=$(grep -h 'package:' providers/function-*.yaml | awk '{print $2}')
          imgs="$imgs xpkg.crossplane.io/crossplane/crossplane:stable"
          for i in $imgs; do
            echo "pulling $i"
            docker pull --quiet "$i"
          done
          docker save -o /tmp/fn-images.tar $imgs

      # golden + invariants. XRD conformance already ran in the `static` job, but
      # `make test` includes it and re-running it costs nothing.
      - name: Composition test suite
        run: make test

      # kubeconform is only installed in the `static` job — jobs run on separate
      # VMs with no shared filesystem, so nothing installed there carries over
      # here. Without this, test-structural fails with
      # FileNotFoundError: [Errno 2] No such file or directory: 'kubeconform'.
      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      # Best-effort third-party schema filter. Kept non-blocking on purpose: it
      # validates against a public catalogue rather than the pinned operator
      # versions, so it can only ever be a filter. A red mark here is worth
      # reading, not worth blocking a merge.
      - name: Structural check (advisory)
        continue-on-error: true
        run: make test-structural

  # ── Release-readiness checks, PR only ──────────────────────────────────────
  release-hygiene:
    name: Release hygiene
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          # A venv, not a bare `pip install`, matches the local-dev convention
          # already documented in CLAUDE.md/CONTRIBUTING.md (~/.python3-venv) and
          # sidesteps PEP 668's externally-managed-environment block regardless of
          # what the runner's base image does with its own system Python — no
          # dependency on guessing why a bare install might fail.
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/pip install --quiet PyYAML

      # There is no version to bump: `make release` names the release by date
      # and pins changed packages itself. What a PR must not do is hand-edit
      # those pins — a manifest pinned to a tag CI never built, or to the wrong
      # registry, installs nothing.
      - name: Package pins agree with VERSIONS.yaml
        run: |
          python3 .gitea/scripts/release-state.py check \
            || { echo "::error::package/install/ and VERSIONS.yaml disagree — both are written by make release"; exit 1; }

      - name: README packages table in sync
        run: |
          python3 .gitea/scripts/gen-readme-packages.py --check \
            || { echo "::error::run 'make readme-sync'"; exit 1; }
