name: Publish Crossplane Packages

# Builds and pushes the packages a release tag pins, then creates the GitHub release.
# VERSIONS.yaml is the package list: a package is rebuilt only when its `current` equals the tag.

on:
  push:
    tags:
      - "release-*"

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to ghcr.io

env:
  REGISTRY: ghcr.io/wxops-idp/wxops-core

jobs:
  validate:
    name: Validate packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/crossplane
          crossplane version --client

      - name: Run package validation
        run: bash .gitea/scripts/validate-packages.sh

  discover:
    name: Discover packages
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # VERSIONS.yaml is the only package list (ADR-002 groups, RFC-007 layout).
      # Adding a package is one edit there — never a second edit here.
      - name: List packages
        id: list
        run: |
          python3 -m pip install --quiet -r tests/requirements.txt
          packages=$(python3 tests/lib/packages.py list \
            | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "→ $packages"

  build-push:
    name: Build and push ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: [validate, discover]

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/crossplane
          crossplane version --client

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No change detection here — `make release` did it and wrote the answer
      # into VERSIONS.yaml. Recomputing it would be a second source of truth.
      - name: Is this package in the release?
        id: changed
        env:
          PKG: ${{ matrix.package }}
          TAG: ${{ github.ref_name }}
        run: |
          current=$(sed -n "/^  ${PKG}:/,/^  [a-z]/p" VERSIONS.yaml | grep "current:" | awk '{print $2}')
          if [ "$current" = "$TAG" ]; then
            echo "→ ${PKG}: pinned to ${TAG} — building"
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "→ ${PKG}: unchanged, last changed in ${current} — skipping"
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.changed.outputs.value == 'true'
        env:
          PKG: ${{ matrix.package }}
        run: |
          dir=$(sed -n "/^  ${PKG}:/,/^  [a-z]/p" VERSIONS.yaml | awk '/path:/{print $2; exit}')
          [ -n "$dir" ] || { echo "::error::no path for ${PKG} in VERSIONS.yaml"; exit 1; }
          echo "→ building $dir"
          crossplane xpkg build \
            -f "$dir" \
            -o ${{ matrix.package }}.xpkg \
            --ignore kustomization.yaml

      - name: Push release tag
        if: steps.changed.outputs.value == 'true'
        run: |
          crossplane xpkg push \
            ${{ env.REGISTRY }}/${{ matrix.package }}:${{ github.ref_name }} \
            -f ${{ matrix.package }}.xpkg

      - name: Push latest tag
        if: steps.changed.outputs.value == 'true'
        run: |
          crossplane xpkg push \
            ${{ env.REGISTRY }}/${{ matrix.package }}:latest \
            -f ${{ matrix.package }}.xpkg

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      # Full history: the package table measures changes against the previous
      # release tag, and git-cliff needs the tags to find this release's commits.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/pip install --quiet git-cliff -r tests/requirements.txt

      - name: Build release body
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          body=/tmp/release-body.md
          : > "$body"
          # Optional for a `safe` release; `make release` refused to tag
          # anything else without it.
          if [ -f "release-notes/${TAG}.md" ]; then
            { cat "release-notes/${TAG}.md"; printf '\n---\n\n'; } >> "$body"
          fi
          {
            printf '## Packages\n\n'
            python3 .gitea/scripts/release-state.py summary "$TAG"
            printf '\n---\n\n'
          } >> "$body"
          git-cliff --current --strip all >> "$body"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/release-body.md
          draft: false
          prerelease: false
