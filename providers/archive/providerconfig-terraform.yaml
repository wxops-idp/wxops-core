# ARCHIVED — kept for the record, not applied by `make providers` (which does not descend into
# providers/archive/). This is the engine the now-retired gitea-user/-org/-team/-repository
# packages ran on (see package/platform/archives/); every active package runs on provider-opentofu.
# If those packages are ever resurrected, this file and its ProviderConfig go with them.
apiVersion: tf.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  # Kubernetes backend persists state in a Secret so it survives pod restarts.
  # in_cluster_config uses the provider pod's own service account — no extra credentials needed.
  configuration: |
    terraform {
      backend "kubernetes" {
        secret_suffix     = "tfstate"
        namespace         = "crossplane-system"
        in_cluster_config = true
      }
    }
