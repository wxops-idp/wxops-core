apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: default
spec:
  # Uses the provider pod's own service account — no extra credentials needed.
  # The Crossplane SA must have RBAC to manage CNPG CRDs (Cluster, Database, Pooler,
  # ScheduledBackup) and ExternalSecret/PushSecret resources across cluster and
  # tenant namespaces.
  #
  # platform-database-clusters also wraps a postgresql.sql.crossplane.io/v1alpha1
  # ProviderConfig (cluster-scoped, named after clusterName) via this provider,
  # and tenant-database wraps a postgresql.sql.crossplane.io/v1alpha1 Role
  # (cluster-scoped) the same way. The Crossplane SA needs RBAC for
  # providerconfigs.postgresql.sql.crossplane.io and roles.postgresql.sql.crossplane.io
  # (create/get/update/delete) for these to apply successfully — see
  # providers/packages/provider-sql.yaml.
  #
  # tenant-app additionally wraps deployments.apps, services, and
  # ingresses.networking.k8s.io (always), plus
  # externalsecrets.external-secrets.io (if externalSecrets.enabled) — all in
  # the tenant's own namespace, via this provider. The same RBAC already
  # granted for tenant-database's ExternalSecret/PushSecret usage covers the
  # external-secrets.io group here. When database.enabled is set, the
  # Composition also emits a composed XTenantDatabase XR directly (not
  # wrapped via this provider) — Crossplane core needs RBAC for
  # xtenantdatabases.platform.wxops.cloud (already granted for
  # tenant-database) to manage it.
  credentials:
    source: InjectedIdentity
