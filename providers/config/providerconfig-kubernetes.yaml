apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: default
spec:
  # Uses the provider pod's own service account — no extra credentials needed.
  # The Crossplane SA must have RBAC to manage CNPG CRDs (Cluster, Database, Pooler,
  # ScheduledBackup) and ExternalSecret/PushSecret resources across cluster and
  # tenant namespaces.
  #
  # database-cluster also wraps a postgresql.sql.crossplane.io/v1alpha1
  # ProviderConfig (cluster-scoped, named after clusterName) via this provider,
  # and database wraps a postgresql.sql.crossplane.io/v1alpha1 Role
  # (cluster-scoped) the same way. The Crossplane SA needs RBAC for
  # providerconfigs.postgresql.sql.crossplane.io and roles.postgresql.sql.crossplane.io
  # (create/get/update/delete) for these to apply successfully — see
  # providers/packages/provider-sql.yaml.
  #
  # app wraps deployments.apps, services, and the Traefik, cert-manager and
  # Prometheus Operator kinds — all in the tenant's own namespace — through the
  # namespaced twin of this config, providerconfig-kubernetes-m.yaml: its Objects are
  # kubernetes.m.crossplane.io. The same RBAC (providers/rbac/provider-kubernetes.yaml)
  # is the ceiling of both.
  credentials:
    source: InjectedIdentity
