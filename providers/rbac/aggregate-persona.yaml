# Persona roles: Kubernetes' own view/edit/admin pieces (selected by the standard aggregate-to-* labels) plus W'xOps extras, so adding a permission to a persona is one labelled
# ClusterRole. Bound by XPersonaBinding (RFC-009) with a RoleBinding per owned namespace — binding a ClusterRole by RoleBinding grants only that namespace.
# Do not bind these (or view/edit/admin) with a ClusterRoleBinding; cluster-wide power comes only from wxops:platform-* and only for W'xOps kinds.
#
# Extend a persona with one piece:
#   kind: ClusterRole
#   metadata: {name: wxops:piece:developers-pods-log, labels: {auth.wxops.cloud/aggregate-to-persona-developers: "true"}}
#   rules: [{apiGroups: [""], resources: ["pods/log"], verbs: ["get", "list"]}]
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wxops:persona-viewers
aggregationRule:
  clusterRoleSelectors:
    - matchLabels: {rbac.authorization.k8s.io/aggregate-to-view: "true"}
    - matchLabels: {auth.wxops.cloud/aggregate-to-persona-viewers: "true"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wxops:persona-developers
aggregationRule:
  clusterRoleSelectors:
    - matchLabels: {rbac.authorization.k8s.io/aggregate-to-edit: "true"}
    - matchLabels: {auth.wxops.cloud/aggregate-to-persona-developers: "true"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wxops:persona-owners
aggregationRule:
  clusterRoleSelectors:
    - matchLabels: {rbac.authorization.k8s.io/aggregate-to-admin: "true"}
    - matchLabels: {auth.wxops.cloud/aggregate-to-persona-owners: "true"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wxops:persona-platform
aggregationRule:
  clusterRoleSelectors:
    - matchLabels: {rbac.authorization.k8s.io/aggregate-to-admin: "true"}
    - matchLabels: {auth.wxops.cloud/aggregate-to-persona-platform: "true"}
