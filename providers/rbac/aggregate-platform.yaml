# Platform API roles: W'xOps's own kinds only, so a persona can be given "edit the platform" without "edit every namespace" (RFC-009).
# Platform-run kinds are cluster-scoped, so they are bound by XPersonaBinding with a ClusterRoleBinding (scope: platform). The tenant kinds (tenant.wxops.cloud, ADR-005) are
# namespaced and written by team personas in their own namespaces (aggregate-persona.yaml); only platform-admin writes them everywhere.
#
# Each role aggregates the pieces carrying its label. Pieces nest the way the built-in view/edit/admin do: a read piece carries all three labels, a piece for a kind
# platform personas may edit without admin would carry edit + admin, a platform-only piece carries admin alone. wxops:platform-edit has no write piece today — the
# tenant kinds it once wrote moved to namespaces — and stays so that an XPersonaBinding naming it keeps working. Add a kind by adding its resource to a piece.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wxops:platform-view
aggregationRule:
  clusterRoleSelectors:
    - matchLabels: {auth.wxops.cloud/aggregate-to-platform-view: "true"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wxops:platform-edit
aggregationRule:
  clusterRoleSelectors:
    - matchLabels: {auth.wxops.cloud/aggregate-to-platform-edit: "true"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wxops:platform-admin
aggregationRule:
  clusterRoleSelectors:
    - matchLabels: {auth.wxops.cloud/aggregate-to-platform-admin: "true"}
---
# Read every W'xOps kind (references, never secret values).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wxops:piece:platform-read
  labels:
    auth.wxops.cloud/aggregate-to-platform-view: "true"
    auth.wxops.cloud/aggregate-to-platform-edit: "true"
    auth.wxops.cloud/aggregate-to-platform-admin: "true"
rules:
  - apiGroups: ["platform.wxops.cloud", "tenant.wxops.cloud", "scm.wxops.cloud", "auth.wxops.cloud"]
    resources: ["*", "*/status"]
    verbs: ["get", "list", "watch"]
---
# Platform-only kinds: connections, OAuth apps, teams, repositories, database clusters, and the auth.wxops.cloud kinds themselves — and write on every tenant.wxops.cloud kind, which teams write only in their own namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wxops:piece:platform-admin-write
  labels:
    auth.wxops.cloud/aggregate-to-platform-admin: "true"
rules:
  - apiGroups: ["platform.wxops.cloud"]
    resources: ["xdatabaseclusters"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["tenant.wxops.cloud"]
    resources: ["*"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["scm.wxops.cloud"]
    resources: ["*"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["auth.wxops.cloud"]
    resources: ["*"]
    verbs: ["create", "update", "patch", "delete"]
---
# Crossplane reads the tenant Namespaces for XPersonaBinding (function-extra-resources, scope: owned). Aggregated into Crossplane's own role, which Crossplane's RBAC manager
# supports for exactly this. Harmless where Crossplane can already list namespaces; verify with `kubectl auth can-i list namespaces --as=system:serviceaccount:crossplane-system:crossplane`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wxops:piece:crossplane-read-namespaces
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
