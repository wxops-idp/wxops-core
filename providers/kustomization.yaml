# Shared Crossplane providers, functions, RBAC and configuration, in four categories — each its own kustomization, so each can be edited, reviewed
# and applied (or given its own Argo CD Application) alone:
#
#   functions/   Crossplane Functions            make providers-functions
#   packages/    Provider packages + runtime     make providers-packages   (waits until Installed and Healthy)
#   rbac/        static RBAC                     make providers-rbac
#   config/      ProviderConfigs                 make providers-config     (waits until each ProviderConfig API is served)
#
# This file is the all-at-once view, for a GitOps engine: `kubectl apply -k providers/`. Argo CD and Flux retry, so they settle on their own. For a human on a
# cold cluster, order matters — a ProviderConfig cannot be created before its provider's CRDs are served, and kustomize cannot wait, so one apply here would
# fail on exactly those objects. `make providers` runs the four in order and waits where it must.
#
# Not listed, on purpose:
#   archive/   — retired or legacy manifests (see archive/README.md); apply by hand if you still need them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - functions
  - packages
  - rbac
  - config
