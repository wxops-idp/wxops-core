# .pre-commit-config.yaml
#
# Install (run both — they register different git hooks):
#   pip install pre-commit
#   pre-commit install                         # registers .git/hooks/pre-commit
#   pre-commit install --hook-type commit-msg  # registers .git/hooks/commit-msg
#
# Run all:  pre-commit run --all-files
# Update:   pre-commit autoupdate
#
# Hooks:
#   commit-msg  1. Conventional commit format enforcement
#   pre-commit  2. YAML style          (yamllint)
#               3. Kubernetes schema   (kubeconform)
#               4. Crossplane build    (crossplane xpkg build)
#               5. KCL drift check     (composition.yaml vs kcl/ source)
#               6. Package pins        (VERSIONS.yaml vs package/install/)
#               7. README packages     (README.md table vs VERSIONS.yaml)
#               8. Tests               (XRD conformance, API compatibility, invariants)
#   pre-push    9. Golden render tests
#
# Allowed commit types (must stay in sync with cliff.toml commit_parsers):
#   feat | fix | perf | refactor | docs | test | chore | revert

default_stages: [pre-commit]

repos:
  # ── Conventional commit enforcement (commit-msg stage) ───────────────────────
  # Validates commit messages against the Conventional Commits spec.
  # Types mirror cliff.toml commit_parsers — adding a type here requires a
  # matching parser entry there so it appears in the changelog.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat    # new feature        → Features
          - fix     # bug fix            → Bug Fixes
          - perf    # performance        → Performance
          - refactor # code restructure  → Refactor
          - docs    # documentation      → Documentation
          - test    # tests              → Testing
          - chore   # maintenance        → Chores  (chore(ci) → CI/CD)
          - revert  # revert a commit    → Reverts

  # ── Standard file hygiene ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: \.md$  # allow trailing whitespace in markdown files
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      # Blocks `git commit` while checked out on main — catches the mistake
      # before it even happens, not just before a push. Local safety net only:
      # anyone without this hook installed, or using --no-verify, bypasses it.
      # Real enforcement needs a server-side branch protection rule.
      - id: no-commit-to-branch
        args: [--branch, main]

  # ── YAML style ───────────────────────────────────────────────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]
        # Exclude generated or vendor-style files
        exclude: |
          (?x)^(
            \.git/.*
          )$

  # ── Kubernetes manifest validation ──────────────────────────────────────────
  # kubeconform validates manifests against published JSON schemas.
  # Runs as a local hook using the system-installed kubeconform binary.
  # Install: https://github.com/yannh/kubeconform#installation
  # --ignore-missing-schemas lets Crossplane-specific kinds (XRD, Composition,
  # Workspace, etc.) pass through without error — they are checked by the
  # crossplane-validate hook below.
  - repo: local
    hooks:
      - id: kubeconform
        name: kubeconform
        language: system
        entry: kubeconform
        args:
          - -schema-location
          - default
          - -schema-location
          # Pinned: tracking `main` would let upstream change what this hook accepts
          # with no commit here. Keep in sync with CRDS_CATALOG_REF in the Makefile.
          - "https://raw.githubusercontent.com/datreeio/CRDs-catalog/52b0261318acc7dd0b66e032759b1f218216b980/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          - -ignore-missing-schemas
          - -summary
          - -output
          - pretty
        files: \.(yaml|yml)$
        exclude: |
          (?x)^(
            examples/.*|
            kcl/.*|
            \.gitea/.*|
            \.github/.*|
            \.gitlab/.*|
            VERSIONS\.yaml|
            tests/api-compat-allow\.yaml|
            CHANGELOG\.md|
            .pre-commit-config\.yaml|
            .yamllint\.yaml
          )$

  # ── Crossplane package build (render test) ───────────────────────────────────
  # Runs `crossplane xpkg build` for each package directory.
  # Builds to a temp location and cleans up — acts as a full render+lint pass.
  # Requires `crossplane` CLI on PATH (https://docs.crossplane.io/latest/cli/).
  - repo: local
    hooks:
      - id: crossplane-validate
        name: crossplane xpkg build (all packages)
        language: script
        entry: .gitea/scripts/validate-packages.sh
        pass_filenames: false
        files: ^package/
        types: [yaml]

  # ── KCL drift check ──────────────────────────────────────────────────────────
  # Ensures composition.yaml spec.source is in sync with kcl/{pkg}/main.k.
  # If you edit main.k, run `make kcl-sync` before committing.
  - repo: local
    hooks:
      - id: kcl-drift-check
        name: kcl source in sync with compositions
        language: python
        additional_dependencies: [pyyaml]
        entry: python3 .gitea/scripts/kcl-sync.py --check
        pass_filenames: false
        files: ^(kcl/|package/.*/composition\.yaml)

  # ── Package pins ─────────────────────────────────────────────────────────────
  # VERSIONS.yaml `current` and package/install/*.yaml are written together by
  # `make release` and must agree. There is no version to bump by hand: a
  # release is named by date, and compatibility is guarded by test-api-compat.
  - repo: local
    hooks:
      - id: release-state-check
        name: package/install pins agree with VERSIONS.yaml
        language: python
        additional_dependencies: [pyyaml]
        entry: python3 .gitea/scripts/release-state.py check
        pass_filenames: false
        files: ^(VERSIONS\.yaml|package/install/)

  # ── README packages table sync ────────────────────────────────────────────────
  # Runs after release-state-check so the table always reflects pins that
  # already agree with package/install/.
  # If you add a package or an API version, run `make readme-sync` before
  # committing.
  - repo: local
    hooks:
      - id: readme-packages-table
        name: README packages table in sync with VERSIONS.yaml
        language: python
        additional_dependencies: [pyyaml]
        entry: python3 .gitea/scripts/gen-readme-packages.py --check
        pass_filenames: false
        files: ^(VERSIONS\.yaml|README\.md|package/.*/xrd\.yaml)$

  # ── Test suite ───────────────────────────────────────────────────────────────
  # See tests/README.md. Split by cost:
  #   xrd + invariants  — no Docker, ~0.5s total, run on every commit
  #   golden            — ~90s (a container per function per case), runs on push
  # Requires: pip install -r tests/requirements.txt  (or `make test-deps`)
  - repo: local
    hooks:
      - id: test-xrd
        name: XRs conform to our XRD schemas
        language: python
        additional_dependencies: [pyyaml, jsonschema]
        entry: python3 tests/xrd.py
        pass_filenames: false
        files: ^(package/.*/xrd\.yaml|examples/|tests/cases/)

      - id: test-invariants
        name: composition invariants and field contracts
        language: python
        additional_dependencies: [pyyaml]
        entry: python3 tests/invariants.py
        pass_filenames: false
        files: ^(tests/|kcl/|package/.*/composition\.yaml)

      # Diffs against the last release tag through git — no Docker, well under
      # a second. Fails on a breaking change to an already-released XRD.
      - id: test-api-compat
        name: released API stays additive (vs last release tag)
        language: python
        additional_dependencies: [pyyaml, jsonschema]
        entry: python3 tests/api_compat.py
        pass_filenames: false
        files: ^(package/.*/xrd\.yaml|tests/)

      - id: test-golden
        name: golden render tests (slow — push only)
        language: python
        additional_dependencies: [pyyaml, jsonschema]
        entry: python3 tests/golden.py
        pass_filenames: false
        stages: [pre-push]
        files: ^(kcl/|package/|tests/|examples/)
