# VERSIONS.yaml — the XRD API versions each package serves, and the release each
# package last changed in.
#
# Two axes, never mixed:
#
#   api      — the Kubernetes API version the XRD serves (platform.wxops.cloud/v1alpha1).
#              This is the contract: dev XRs, prod XRs and the portal all bind to it.
#              Edited by hand, and rarely.
#   group    — the API group the package's kinds live in (tenant | platform | scm | auth), per ADR-002 and ADR-005.
#   path     — where the package directory lives, per RFC-007. `tests/lib/packages.py` is the one
#              resolver; nothing derives a directory from a package name by string rules.
#   package  — `current` is the release (release-YYYY-MM-DD[.N]) in which the package's
#              content last changed: the OCI tag package/install/ pins. Written by
#              `make release`, never by hand. Legacy vX.Y.Z values stay until the
#              package next changes; `unreleased` marks a package that never shipped.
#
# API rules — a released XRD is additive-only:
#   • Adding optional fields, status fields or whole new objects is always fine.
#   • Never remove or retype a field, make a field required on an existing object,
#     narrow an enum or bound, or rename a composed resource.
#   • A new API version is NOT a way around that. Crossplane: "the schema of each
#     version can't change any existing fields", and breaking changes between
#     versions need conversion webhooks — a custom server, which this repo's
#     no-controllers rule excludes. A breaking need becomes a new field beside
#     the old one, or a new Kind.
#     https://docs.crossplane.io/latest/composition/composite-resource-definitions/
#   • tests/api_compat.py enforces all of this against the last release tag.
#
# Date-named OCI tags are not semver, so a Crossplane `dependsOn` version range
# cannot target these packages; pin an exact tag or digest if one ever must.
#
# API version decision (development-docs/_archives/ROADMAP.md Phase 0 §0.5, decided): every released XRD stays
# on v1alpha1 through the portal's first integration. Every Phase 0 change
# (status parity, monitoring, targetCluster, darlane status) was purely
# additive, so nothing forced a bump. Promotion to v1beta1 at release readiness
# (development-docs/_archives/ROADMAP.md's OSS-release section) is a stability commitment over an identical
# schema — per the rule above, not a schema change. The portal pins the API version, never a core
# release. See docs/api-reference/status-contract.md for the status fields it binds to.

packages:

# gitea-user/-org/-team/-repository and the random-password utility are ARCHIVED as of this
# release, not deleted: no cluster ran them (no live deployment existed to migrate), and every
# active package now runs on OpenTofu, so keeping them served bought nothing. Dropping them
# from this file is what makes them `breaking`/package-removed to tests/api_compat.py — see
# tests/api-compat-allow.yaml. Source, tests, examples and docs all moved, not deleted: package
# source to package/platform/archives/<name>/, and the rest to the sibling `_archives/` folder
# in tests/cases/, examples/ and docs/api-reference/ (skipped by test discovery; see
# tests/lib/render.py). provider-terraform went the same way, to providers/archive/.
#
# platform-policy, platform-database-clusters, tenant-app and tenant-database are ARCHIVED as of
# the release that replaced them with policy, database-cluster, app and database (ADR-005,
# RFC-010) — after every XR of the old kinds had moved by the handover in
# docs/user-guide/migrating-to-new-kinds.md. Same convention, but these four DID run on a
# cluster, so removing them is deliberately `breaking` and the release says so: deleting an
# XRD deletes its XRs. Source moved to package/{platform,auth}/archives/<name>/ and
# kcl/_archives/<name>/, the rest to the sibling `_archives/` folders.

  database-cluster:
    group: platform
    path: package/platform/database-cluster
    package:
      current: release-2026-11-12
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: Platform-managed CloudNativePG cluster with pooler, Vault credential seeding, and shared-cluster labeling for dynamic tenant pool discovery. The successor of `platform-database-clusters` (ADR-005) — the same cluster, under a name that does not repeat the group.

  # ── scm.wxops.cloud — Git hosting across Gitea, GitHub and (later) GitLab ──
  # ADR-002 (API groups) and RFC-003 (the XScm* family). Vendor behaviour lives in each
  # package's OpenTofu module, not in the composition.

  scm-connection:
    group: scm
    path: package/scm/connection
    package:
      current: release-2026-10-16
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: Registers one Git hosting service (vendor, base URL, org, token) and renders the credential every other scm resource reads.

  scm-repository:
    group: scm
    path: package/scm/repository
    package:
      current: release-2026-10-16
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: Creates (managed) or reads (observed) a repository on Gitea or GitHub through one generic OpenTofu module.

  scm-oauth-app:
    group: scm
    path: package/scm/oauth-app
    package:
      current: release-2026-10-16
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: Registers a host-side OAuth application (Gitea) or adopts an operator-registered one (GitHub), and publishes its credentials to the secret store.

  scm-team:
    group: scm
    path: package/scm/team
    package:
      current: release-2026-10-16
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: Creates (managed) or reads (observed) a team and its membership on Gitea or GitHub, through one generic OpenTofu module.

  # ── auth.wxops.cloud — OIDC configuration, Dex the first broker (RFC-004) ──
  # Every record kind writes one OpenBao record under its connection's prefix; the W'xOps
  # `dexidp` Helm chart (wxops-idp/charts/dexidp) owns the aggregator that turns those
  # records into a running broker's config. Core never runs a broker and never writes
  # Dex's own fixed settings (issuer, storage, expiry) — those are chart values.

  oidc-connection:
    group: auth
    path: package/auth/oidc-connection
    package:
      current: release-2026-10-16
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: Observes the dexidp chart's config ExternalSecret and publishes which broker, issuer and remote-key prefix every other oidc-* resource writes under.

  oidc-static-password:
    group: auth
    path: package/auth/oidc-static-password
    package:
      current: release-2026-11-12
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: A local broker user (bootstrap admin, break-glass), ESO-generated or operator-defined, pushed to OpenBao as a bcrypt-hashed record.

  oidc-client:
    group: auth
    path: package/auth/oidc-client
    package:
      current: release-2026-10-16
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: A downstream OAuth client that logs in through the broker, ESO-generated or operator-defined, pushed to OpenBao.

  oidc-connector:
    group: auth
    path: package/auth/oidc-connector
    package:
      current: release-2026-10-16
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: An upstream Git vendor connector, with its team allow-list generated from labelled XScmTeams, credentials read from an XScmOAuthApp, pushed to OpenBao.

  # ── auth.wxops.cloud — SCM personas: who (XPersona), which kinds (XPersonaBinding), which objects (XPlatformPolicy) — RFC-009 ──
  persona:
    group: auth
    path: package/auth/persona
    package:
      current: release-2026-11-12
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: A persona — a title that collects SCM teams, users and agents into RBAC subjects, with the environments it applies on. Grants nothing by itself.

  persona-binding:
    group: auth
    path: package/auth/persona-binding
    package:
      current: release-2026-11-09
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: Binds a persona's subjects to a standard, persona or Platform API ClusterRole — RoleBindings in the namespaces a team owns, or one ClusterRoleBinding. The only composition that emits RBAC, and only bindings.

  policy:
    group: auth
    path: package/auth/policy
    package:
      current: release-2026-11-12
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: One reviewed Kyverno CEL policy per resource — owner-stamp, owner-seal, secret-guard, exec-guard, protected, rbac-guard, sa-guard, namespace-guard or env-gate — matching SCM users only, Deny by default. Kyverno refuses; it never grants. The successor of `platform-policy` (ADR-005) — the same rules, under a name that does not repeat the group.

  # ── tenant.wxops.cloud — namespaced kinds a team owns, one owner per namespace (ADR-005, RFC-010) ──

  app:
    group: tenant
    path: package/tenant/app
    package:
      current: release-2026-11-12
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: Namespaced tenant application scaffold (Deployment, Service, Traefik IngressRoute, Darlane debug-twin) owned by the namespace it runs in — owner and target come from the namespace, never a field. The successor of tenant-app (ADR-005, RFC-010).

  database:
    group: tenant
    path: package/tenant/database
    package:
      current: release-2026-11-12
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: Namespaced tenant PostgreSQL database on a platform CNPG cluster (Role, Database, credentials pushed to OpenBao) owned by the namespace it is created in — owner and cluster are never fields. The successor of tenant-database (ADR-005, RFC-010).

# Utility compositions — not yet published as standalone OCI packages.
utilities:
