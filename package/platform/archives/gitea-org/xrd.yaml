apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xgiteaorgs.platform.wxops.cloud
spec:
  group: platform.wxops.cloud
  scope: Cluster
  names:
    kind: XGiteaOrg
    plural: xgiteaorgs
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - parameters
              properties:
                parameters:
                  type: object
                  required:
                    - giteaUrl
                    - orgName
                    - credentialsSecretRef
                  properties:
                    giteaUrl:
                      type: string
                      description: Base URL of the Gitea instance (e.g. https://gitea.example.com).
                    insecure:
                      type: boolean
                      default: false
                      description: Skip TLS verification. True only for local/dev instances.
                    orgName:
                      type: string
                      description: Gitea organization login name (immutable after creation).
                    fullName:
                      type: string
                      default: ""
                      description: Display name shown in the Gitea UI.
                    description:
                      type: string
                      default: ""
                    website:
                      type: string
                      default: ""
                    location:
                      type: string
                      default: ""
                    visibility:
                      type: string
                      default: public
                      enum: [public, limited, private]
                    repoAdminChangeTeamAccess:
                      type: boolean
                      default: false
                      description: |
                        Allow repository admins to add and remove teams from repositories,
                        even if they are not organization admins.
                    credentialsSecretRef:
                      type: object
                      description: |
                        Secret holding the Gitea admin token in tfvars format:
                          gitea_token = "admin-token"
                      required:
                        - name
                        - namespace
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
            status:
              type: object
              properties:
                created:
                  type: boolean
                  description: |
                    True once the Terraform apply has completed and written state.
                    Derived from the presence of the org_id output, which only
                    exists after a successful apply.

                    Absent — not false — until that first successful apply, because
                    the patch is skipped while its source path does not exist. Treat
                    absent as false. (The KCL-based packages emit an explicit false
                    instead; this is the one place the contract differs.)
                ready:
                  type: boolean
                  description: |
                    True when the Gitea organisation exists. Equal to `created` by
                    construction — a organisation either exists or does not, there is no
                    rollout phase — but exposed under the same name every other
                    W'xOps package uses so consumers have one field to poll.

                    Caveat: this reflects the last *successful* apply. If a later
                    apply fails the outputs persist, so `ready` stays true while the
                    Workspace's Synced condition goes False. Check Synced alongside
                    this field to detect drift or a failing reconcile.
                orgId:
                  type: string
                  description: Gitea's internal numeric organisation ID.
                orgName:
                  type: string
                  description: Resolved organisation name (echoed from the Terraform output).
