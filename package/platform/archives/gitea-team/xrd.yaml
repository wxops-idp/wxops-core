apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xgiteateams.platform.wxops.cloud
spec:
  group: platform.wxops.cloud
  scope: Cluster
  names:
    kind: XGiteaTeam
    plural: xgiteateams
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - parameters
              properties:
                parameters:
                  type: object
                  required:
                    - giteaUrl
                    - orgName
                    - teamName
                    - credentialsSecretRef
                  properties:
                    giteaUrl:
                      type: string
                      description: Base URL of the Gitea instance.
                    insecure:
                      type: boolean
                      default: false
                    orgName:
                      type: string
                      description: Name of the organization this team belongs to.
                    teamName:
                      type: string
                      description: Team name within the organization.
                    description:
                      type: string
                      default: ""
                    permission:
                      type: string
                      default: read
                      enum: [none, read, write, admin, owner]
                      description: Base permission level for all team members.
                    units:
                      type: string
                      default: "repo.code,repo.issues,repo.pulls"
                      description: |
                        Comma-separated repository feature units the team has access to.
                        Valid values: repo.code, repo.issues, repo.ext_issues, repo.wiki,
                        repo.pulls, repo.releases, repo.projects, repo.ext_wiki.
                        Use enableActions and enablePackages for those units instead of
                        listing them here — they are applied via direct API call.
                    enableActions:
                      type: boolean
                      default: false
                      description: |
                        Grant the team access to the Actions (CI/CD) unit. Applied via
                        Gitea API because the Terraform provider does not support this unit.
                    actionsReadOnly:
                      type: boolean
                      default: false
                      description: |
                        Force repo.actions to read-only, overriding the base permission.
                        Only effective when enableActions is true. When set, the PATCH
                        uses units_map so repo.actions gets "read" while all base units
                        retain the configured permission level.
                    enablePackages:
                      type: boolean
                      default: false
                      description: |
                        Grant the team access to the Packages (container/artifact registry)
                        unit. Applied via Gitea API because the Terraform provider does not
                        support this unit.
                    packagesReadOnly:
                      type: boolean
                      default: false
                      description: |
                        Force repo.packages to read-only, overriding the base permission.
                        Only effective when enablePackages is true. When set, the PATCH
                        uses units_map so repo.packages gets "read" while all base units
                        retain the configured permission level.
                    includeAllRepositories:
                      type: boolean
                      default: false
                      description: Automatically grant access to all org repositories.
                    canCreateRepos:
                      type: boolean
                      default: false
                      description: Allow team members to create repositories in the org.
                    members:
                      type: string
                      default: ""
                      description: |
                        Comma-separated list of Gitea usernames to add as team members.
                        Membership is reconciled on every sync — removing a name removes
                        the user from the team. Works for both managed and pre-existing users.
                    credentialsSecretRef:
                      type: object
                      description: |
                        Secret holding the Gitea admin token in tfvars format:
                          gitea_token = "admin-token"
                      required:
                        - name
                        - namespace
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
            status:
              type: object
              properties:
                created:
                  type: boolean
                  description: |
                    True once the Terraform apply has completed and written state.
                    Derived from the presence of the team_id output, which only
                    exists after a successful apply.

                    Absent — not false — until that first successful apply, because
                    the patch is skipped while its source path does not exist. Treat
                    absent as false. (The KCL-based packages emit an explicit false
                    instead; this is the one place the contract differs.)
                ready:
                  type: boolean
                  description: |
                    True when the Gitea team exists. Equal to `created` by
                    construction — a team either exists or does not, there is no
                    rollout phase — but exposed under the same name every other
                    W'xOps package uses so consumers have one field to poll.

                    Caveat: this reflects the last *successful* apply. If a later
                    apply fails the outputs persist, so `ready` stays true while the
                    Workspace's Synced condition goes False. Check Synced alongside
                    this field to detect drift or a failing reconcile.
                teamId:
                  type: string
                  description: Gitea's internal numeric team ID.
                teamName:
                  type: string
                  description: Resolved team name (echoed from the Terraform output).
