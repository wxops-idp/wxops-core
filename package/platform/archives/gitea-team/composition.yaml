apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xgiteateams.platform.wxops.cloud
  labels:
    crossplane.io/xrd: xgiteateams.platform.wxops.cloud
    channel: stable
spec:
  compositeTypeRef:
    apiVersion: platform.wxops.cloud/v1alpha1
    kind: XGiteaTeam

  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: tf-workspace
            base:
              apiVersion: tf.upbound.io/v1beta1
              kind: Workspace
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  source: Inline
                  module: |
                    terraform {
                      required_providers {
                        gitea = {
                          source  = "go-gitea/gitea"
                          version = "~> 0.7.0"
                        }
                        null = {
                          source  = "hashicorp/null"
                          version = "~> 3.0"
                        }
                      }
                    }

                    variable "gitea_url"  { type = string }
                    variable "insecure" {
                      type    = bool
                      default = false
                    }
                    variable "org_name"  { type = string }
                    variable "team_name" { type = string }
                    variable "description" {
                      type    = string
                      default = ""
                    }
                    variable "permission" {
                      type    = string
                      default = "read"
                    }
                    variable "units" {
                      type    = string
                      default = "repo.code,repo.issues,repo.pulls"
                    }
                    variable "include_all_repositories" {
                      type    = bool
                      default = false
                    }
                    variable "can_create_repos" {
                      type    = bool
                      default = false
                    }
                    # Comma-separated usernames. Empty string means no members.
                    variable "members" {
                      type    = string
                      default = ""
                    }
                    variable "enable_actions" {
                      type    = bool
                      default = false
                    }
                    variable "actions_read_only" {
                      type    = bool
                      default = false
                    }
                    variable "enable_packages" {
                      type    = bool
                      default = false
                    }
                    variable "packages_read_only" {
                      type    = bool
                      default = false
                    }

                    variable "gitea_token" {
                      type      = string
                      sensitive = true
                    }

                    provider "gitea" {
                      base_url = var.gitea_url
                      token    = var.gitea_token
                      insecure = var.insecure
                    }

                    resource "gitea_team" "this" {
                      name                     = var.team_name
                      organisation             = var.org_name
                      description              = var.description
                      permission               = var.permission
                      units                    = var.units
                      include_all_repositories = var.include_all_repositories
                      can_create_repos         = var.can_create_repos
                    }

                    # Membership is reconciled on every sync.
                    # Removing a username from the list removes them from the team.
                    locals {
                      member_list = var.members == "" ? [] : [
                        for m in split(",", var.members) : trimspace(m)
                      ]
                    }

                    resource "gitea_team_membership" "this" {
                      for_each = toset(local.member_list)
                      team_id  = gitea_team.this.id
                      username = each.key
                    }

                    # repo.actions and repo.packages are not in the Terraform provider
                    # unit enum (v0.7.x), so they are applied via direct Gitea API call.
                    # When a readOnly flag is active, switches to units_map so that unit
                    # gets "read" while all base units keep the configured permission.
                    resource "null_resource" "extended_units" {
                      count = (var.enable_actions || var.enable_packages) ? 1 : 0

                      triggers = {
                        team_id            = gitea_team.this.id
                        units              = var.units
                        permission         = var.permission
                        enable_actions     = tostring(var.enable_actions)
                        enable_packages    = tostring(var.enable_packages)
                        actions_read_only  = tostring(var.actions_read_only)
                        packages_read_only = tostring(var.packages_read_only)
                      }

                      provisioner "local-exec" {
                        environment = {
                          GITEA_TOKEN        = var.gitea_token
                          GITEA_URL          = var.gitea_url
                          TEAM_ID            = tostring(gitea_team.this.id)
                          BASE_UNITS         = var.units
                          PERMISSION         = var.permission
                          ENABLE_ACTIONS     = tostring(var.enable_actions)
                          ENABLE_PACKAGES    = tostring(var.enable_packages)
                          ACTIONS_READ_ONLY  = tostring(var.actions_read_only)
                          PACKAGES_READ_ONLY = tostring(var.packages_read_only)
                          INSECURE           = tostring(var.insecure)
                        }
                        command = <<-EOT
                          ACTIONS_PERM=""
                          [ "$ENABLE_ACTIONS" = "true" ] && ACTIONS_PERM="$PERMISSION"
                          [ "$ENABLE_ACTIONS" = "true" ] && [ "$ACTIONS_READ_ONLY" = "true" ] && ACTIONS_PERM="read"
                          PACKAGES_PERM=""
                          [ "$ENABLE_PACKAGES" = "true" ] && PACKAGES_PERM="$PERMISSION"
                          [ "$ENABLE_PACKAGES" = "true" ] && [ "$PACKAGES_READ_ONLY" = "true" ] && PACKAGES_PERM="read"
                          USE_MAP="false"
                          [ "$ACTIONS_READ_ONLY" = "true" ] && [ "$ENABLE_ACTIONS" = "true" ] && USE_MAP="true"
                          [ "$PACKAGES_READ_ONLY" = "true" ] && [ "$ENABLE_PACKAGES" = "true" ] && USE_MAP="true"
                          if [ "$USE_MAP" = "true" ]; then
                            MAP="{"
                            SEP=""
                            for UNIT in $(echo "$BASE_UNITS" | tr ',' ' '); do
                              [ -z "$UNIT" ] && continue
                              MAP=$MAP$SEP'"'$UNIT'":"'$PERMISSION'"'
                              SEP=","
                            done
                            if [ -n "$ACTIONS_PERM" ]; then
                              MAP=$MAP$SEP'"repo.actions":"'$ACTIONS_PERM'"'
                              SEP=","
                            fi
                            if [ -n "$PACKAGES_PERM" ]; then
                              MAP=$MAP$SEP'"repo.packages":"'$PACKAGES_PERM'"'
                            fi
                            MAP=$MAP"}"
                            BODY='{"units_map":'$MAP'}'
                          else
                            UNITS="$BASE_UNITS"
                            [ "$ENABLE_ACTIONS" = "true" ] && UNITS="$UNITS,repo.actions"
                            [ "$ENABLE_PACKAGES" = "true" ] && UNITS="$UNITS,repo.packages"
                            UNITS_JSON=$(echo "$UNITS" | awk '{
                              n = split($0, a, ",")
                              s = "["
                              for (i = 1; i <= n; i++) {
                                gsub(/^[[:space:]]+|[[:space:]]+$/, "", a[i])
                                s = s "\"" a[i] "\""
                                if (i < n) s = s ","
                              }
                              print s "]"
                            }')
                            BODY='{"units":'$UNITS_JSON'}'
                          fi
                          CURL_FLAGS="-sf"
                          [ "$INSECURE" = "true" ] && CURL_FLAGS="$CURL_FLAGS -k"
                          curl $CURL_FLAGS -X PATCH \
                            "$GITEA_URL/api/v1/teams/$TEAM_ID" \
                            -H "Authorization: token $GITEA_TOKEN" \
                            -H "Content-Type: application/json" \
                            -d "$BODY"
                        EOT
                      }
                    }

                    output "team_id"   { value = gitea_team.this.id }
                    output "team_name" { value = gitea_team.this.name }

                  vars:
                    - key: gitea_url
                      value: placeholder
                    - key: org_name
                      value: placeholder
                    - key: team_name
                      value: placeholder
                    - key: description
                      value: ""
                    - key: permission
                      value: read
                    - key: units
                      value: "repo.code,repo.issues,repo.pulls"
                    - key: include_all_repositories
                      value: "false"
                    - key: can_create_repos
                      value: "false"
                    - key: members
                      value: ""
                    - key: insecure
                      value: "false"
                    - key: enable_actions
                      value: "false"
                    - key: actions_read_only
                      value: "false"
                    - key: enable_packages
                      value: "false"
                    - key: packages_read_only
                      value: "false"

                  varFiles:
                    - source: SecretKey
                      secretKeyRef:
                        namespace: placeholder
                        name: placeholder
                        key: credentials

                writeConnectionSecretToRef:
                  namespace: crossplane-system
                  name: placeholder

            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.uid
                toFieldPath: spec.writeConnectionSecretToRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tf-gitea-team-%s"

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.giteaUrl
                toFieldPath: spec.forProvider.vars[0].value

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.orgName
                toFieldPath: spec.forProvider.vars[1].value

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.teamName
                toFieldPath: spec.forProvider.vars[2].value

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.description
                toFieldPath: spec.forProvider.vars[3].value

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.permission
                toFieldPath: spec.forProvider.vars[4].value

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.units
                toFieldPath: spec.forProvider.vars[5].value

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.includeAllRepositories
                toFieldPath: spec.forProvider.vars[6].value
                transforms:
                  - type: convert
                    convert:
                      toType: string

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.canCreateRepos
                toFieldPath: spec.forProvider.vars[7].value
                transforms:
                  - type: convert
                    convert:
                      toType: string

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.members
                toFieldPath: spec.forProvider.vars[8].value

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.insecure
                toFieldPath: spec.forProvider.vars[9].value
                transforms:
                  - type: convert
                    convert:
                      toType: string

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.enableActions
                toFieldPath: spec.forProvider.vars[10].value
                transforms:
                  - type: convert
                    convert:
                      toType: string

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.actionsReadOnly
                toFieldPath: spec.forProvider.vars[11].value
                transforms:
                  - type: convert
                    convert:
                      toType: string

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.enablePackages
                toFieldPath: spec.forProvider.vars[12].value
                transforms:
                  - type: convert
                    convert:
                      toType: string

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.packagesReadOnly
                toFieldPath: spec.forProvider.vars[13].value
                transforms:
                  - type: convert
                    convert:
                      toType: string

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.credentialsSecretRef.namespace
                toFieldPath: spec.forProvider.varFiles[0].secretKeyRef.namespace

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.credentialsSecretRef.name
                toFieldPath: spec.forProvider.varFiles[0].secretKeyRef.name

              # ── Status write-back ──────────────────────────────────────────
              # provider-terraform publishes non-sensitive outputs under
              # status.atProvider.outputs, and only after `terraform apply` has
              # succeeded and written state. Their presence is therefore the
              # "finished provisioning" signal.
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.outputs.team_id
                toFieldPath: status.teamId
                policy:
                  fromFieldPath: Optional

              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.outputs.team_name
                toFieldPath: status.teamName
                policy:
                  fromFieldPath: Optional

              # created/ready both derive from the same signal: a team either
              # exists or it does not, there is no rollout phase. Two fields are
              # kept so every W'xOps package presents the same status contract.
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.outputs.team_id
                toFieldPath: status.created
                policy:
                  fromFieldPath: Optional
                transforms:
                  - type: match
                    match:
                      patterns:
                        - type: regexp
                          regexp: ".+"
                          result: true
                      fallbackValue: false

              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.outputs.team_id
                toFieldPath: status.ready
                policy:
                  fromFieldPath: Optional
                transforms:
                  - type: match
                    match:
                      patterns:
                        - type: regexp
                          regexp: ".+"
                          result: true
                      fallbackValue: false
