apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xgitearepos.platform.wxops.cloud
spec:
  group: platform.wxops.cloud
  scope: Cluster
  names:
    kind: XGiteaRepository
    plural: xgitearepos
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - parameters
              properties:
                parameters:
                  type: object
                  required:
                    - giteaUrl
                    - orgName
                    - repoName
                    - credentialsSecretRef
                  properties:
                    giteaUrl:
                      type: string
                      description: Base URL of the Gitea instance.
                    insecure:
                      type: boolean
                      default: false
                    orgName:
                      type: string
                      description: Organization that owns the repository.
                    repoName:
                      type: string
                      description: Repository name (immutable after creation).
                    description:
                      type: string
                      default: ""
                    private:
                      type: boolean
                      default: false
                    autoInit:
                      type: boolean
                      default: true
                      description: Initialize the repository with a README.
                    defaultBranch:
                      type: string
                      default: main
                    hasIssues:
                      type: boolean
                      default: true
                    hasWiki:
                      type: boolean
                      default: false
                    hasProjects:
                      type: boolean
                      default: false
                    hasPullRequests:
                      type: boolean
                      default: true
                    credentialsSecretRef:
                      type: object
                      description: |
                        Secret holding the Gitea admin token in tfvars format:
                          gitea_token = "admin-token"
                      required:
                        - name
                        - namespace
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
            status:
              type: object
              properties:
                created:
                  type: boolean
                  description: |
                    True once the Terraform apply has completed and written state.
                    Derived from the presence of the repo_id output, which only
                    exists after a successful apply.

                    Absent — not false — until that first successful apply, because
                    the patch is skipped while its source path does not exist. Treat
                    absent as false. (The KCL-based packages emit an explicit false
                    instead; this is the one place the contract differs.)
                ready:
                  type: boolean
                  description: |
                    True when the Gitea repository exists. Equal to `created` by
                    construction — a repository either exists or does not, there is no
                    rollout phase — but exposed under the same name every other
                    W'xOps package uses so consumers have one field to poll.

                    Caveat: this reflects the last *successful* apply. If a later
                    apply fails the outputs persist, so `ready` stays true while the
                    Workspace's Synced condition goes False. Check Synced alongside
                    this field to detect drift or a failing reconcile.
                repoId:
                  type: string
                  description: Gitea's internal numeric repository ID.
                cloneUrl:
                  type: string
                  description: HTTPS clone URL for the repository.
                sshUrl:
                  type: string
                  description: SSH clone URL for the repository.
                htmlUrl:
                  type: string
                  description: Browser URL for the repository.
