apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xtenantdatabases.platform.wxops.cloud
spec:
  group: platform.wxops.cloud
  scope: Cluster
  names:
    kind: XTenantDatabase
    plural: xtenantdatabases
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - parameters
              properties:
                parameters:
                  type: object
                  required:
                    - dbName
                    - owner
                  properties:
                    cluster:
                      type: string
                      description: |
                        Name of the provider-kubernetes ProviderConfig to apply this
                        XR's composed resources through. Defaults to "default", the
                        local (hub) cluster — the only one wired up today, so leaving
                        this unset is behaviour-neutral.

                        Set it to target a spoke cluster once a ProviderConfig for
                        that spoke exists. See docs/core-ideas/multi-cluster.md.
                    tier:
                      type: string
                      default: "shared"
                      enum: [shared, dedicated]
                      description: |
                        shared    — auto-assign to the least-loaded
                                    XPlatformDatabaseCluster labeled
                                    shared: true. Prevents dbName collisions
                                    per cluster.
                        dedicated — compose a new XPlatformDatabaseCluster as
                                    a child resource (1 cluster = 1 database,
                                    fully isolated). Size via dedicatedCluster.

                        Ignored if clusterRef/clusterNamespace are set
                        explicitly.
                    environment:
                      type: string
                      enum: ["dev", "staging", "prod"]
                      default: "dev"
                      description: |
                        Deployment environment. For tier: shared, the pool is
                        filtered to clusters matching this environment — dev
                        databases only land on dev clusters, prod on prod.
                        For tier: dedicated, passed through to the child
                        cluster's environment field.
                    dedicatedCluster:
                      type: object
                      default: {}
                      description: |
                        Cluster sizing parameters when tier is dedicated.
                        Ignored for tier: shared or when clusterRef is set
                        explicitly.
                      properties:
                        instances:
                          type: integer
                          default: 1
                          minimum: 1
                          maximum: 9
                          description: PostgreSQL instances. 1 = standalone, 3 = HA.
                        storageSize:
                          type: string
                          default: "8Gi"
                          description: PVC storage size per instance.
                        postgresVersion:
                          type: integer
                          default: 16
                          description: PostgreSQL major version.
                        enablePooler:
                          type: boolean
                          default: true
                          description: Deploy a PgBouncer RW pooler on the dedicated cluster.
                        namespace:
                          type: string
                          description: |
                            Namespace for the dedicated cluster. Defaults to
                            cnpg-system if unset.
                    clusterRef:
                      type: string
                      description: |
                        Name of the platform cluster to provision this database on.
                        Must match the clusterName of an existing
                        XPlatformDatabaseCluster (used as spec.cluster.name on
                        the CNPG Database CR, and as the name of the per-cluster
                        provider-sql ProviderConfig created by
                        platform-database-clusters).

                        Optional — when unset, resolved automatically from
                        tier (shared: least-loaded pool cluster; dedicated:
                        composed child cluster). Set explicitly to bypass all
                        tier logic.
                    clusterNamespace:
                      type: string
                      description: |
                        Kubernetes namespace where the CNPG cluster lives. All
                        resources composed by this XR are created here.

                        Optional — when unset, resolved automatically from
                        tier (shared: from the selected pool cluster's status;
                        dedicated: from dedicatedCluster.namespace or
                        cnpg-system). Set explicitly to bypass tier logic.
                    dbName:
                      type: string
                      description: PostgreSQL database name to create. Must be unique per cluster.
                    owner:
                      type: string
                      description: |
                        Team or project identifier (e.g. "rocket-team").
                        Used to scope the Vault path and PostgreSQL role name.
                    extensions:
                      type: array
                      default: []
                      description: |
                        PostgreSQL extensions to enable in the database.
                        Example: [uuid-ossp, pgcrypto, postgis]
                      items:
                        type: string
                    databaseReclaimPolicy:
                      type: string
                      default: "retain"
                      enum: [delete, retain]
                      description: |
                        CNPG Database.spec.databaseReclaimPolicy. "retain" (default)
                        protects this tenant's database from XR/claim deletion: the
                        database (and its data) and its owning role both survive XR
                        deletion and must be cleaned up manually if the tenant is
                        decommissioned.

                        Set to "delete" to have CNPG drop the database when this XR
                        is deleted, which also allows the owning role to be dropped.
                        A ClusterUsage (tenant-role-db-usage) orders this: the role's
                        DROP ROLE is blocked until the database's DROP DATABASE has
                        completed, then replayed — avoiding the "role ... cannot be
                        dropped because some objects depend on it" (2BP01) race that
                        parallel deletion would otherwise cause.

                        Also controls the connection-creds Secret and the
                        ExternalSecret/Password-generator that manage it:
                        "retain" orphans them on XR deletion (the existing
                        password is preserved and reused on recreate — an
                        admin must delete them manually to force a new
                        password); "delete" removes them along with everything
                        else, so recreation generates a brand-new password. A
                        second ClusterUsage (tenant-conn-role-usage) orders
                        this: the connection-creds Secret's deletion is
                        blocked until DROP ROLE has completed, then replayed —
                        otherwise provider-sql's Observe() (which always reads
                        the Role's passwordSecretRef, even while deleting)
                        permanently fails once the Secret is gone, leaving the
                        Role stuck in Terminating forever.
                    vaultSecretStoreName:
                      type: string
                      default: "vault-cluster-store"
                      description: |
                        Name of the ESO ClusterSecretStore used by the PushSecret
                        that writes connection creds to Vault at
                        tenants/{owner}/databases/{dbName}/connection-creds.
                        Consuming that Vault entry into an app namespace (e.g.
                        via an ExternalSecret) is a tenant/GitOps concern, not
                        handled by this XR.
            status:
              type: object
              properties:
                clusterRef:
                  type: string
                  description: |
                    Resolved CNPG cluster name this database is provisioned on.
                    Written by the composition on first assignment and reused on
                    subsequent reconciles (sticky). Other XTenantDatabase XRs
                    read this field (via function-extra-resources) to count
                    databases per cluster for load-balanced pool assignment.
                clusterNamespace:
                  type: string
                  description: Namespace of the resolved cluster.
                tier:
                  type: string
                  description: Resolved tier (shared, dedicated, or explicit).
                dbName:
                  type: string
                  description: PostgreSQL database name (echoed for cross-XR collision checks).
                created:
                  type: boolean
                  description: |
                    True once every composed resource has been observed at least
                    once. Indicates provisioning has started, not that it succeeded.
                ready:
                  type: boolean
                  description: |
                    True when the database is usable: it exists, its owning role
                    exists, and the connection Secret has materialised (plus, on
                    tier: dedicated, the child cluster is up).

                    Derived from observed composed-resource state rather than the
                    native type:Ready condition, which is unreliable on Crossplane
                    v2.3 with function-kcl v0.12.1. Poll this field, not conditions.

                    Vault credential push (PushSecret) is deliberately excluded — if
                    it lags, applications can still connect.
