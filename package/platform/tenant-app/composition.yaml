apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xtenantapps.platform.wxops.cloud
  labels:
    crossplane.io/xrd: xtenantapps.platform.wxops.cloud
    channel: stable
spec:
  compositeTypeRef:
    apiVersion: platform.wxops.cloud/v1alpha1
    kind: XTenantApp

  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-kcl
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        metadata:
          name: render
        spec:
          source: |
            """
            XTenantApp — KCL composition source.

            Inputs (via option("params").oxr.spec.parameters):
              appName     string  Application name. Used for resource names and
                                   app.kubernetes.io/name|instance labels.
              namespace   string  Target namespace for all created resources.
              environment string  One of "dev" (default), "staging", "prod". Applied as
                                   the wxops.cloud/environment label on created resources
                                   — purely metadata for dashboards/cost-reports/Kyverno
                                   generate-policies (NetworkPolicy, ResourceQuota, etc.).
                                   Does not affect any default values.
              appFlavor   string  One of "webapp" (default), "ai", "ai-webapp",
                                   "geo-webapp", "search-webapp". Applied as the
                                   wxops.cloud/app-flavor label — purely metadata for
                                   platform-level automation (e.g. a separate
                                   XTenantDatabase claim choosing pgvector/postgis
                                   extensions, or Kyverno generate-policies) to key off.
                                   Does not affect any resource composed here.
              templateId  string  Optional. Backstage/IDP software-template identifier
                                   this app was scaffolded from. Applied as the
                                   wxops.cloud/template-id annotation on all composed
                                   resources — purely metadata for catalog linking.
              repository.url string Optional. URL of the application's source-code
                                   repository (e.g. a Gitea repo created or imported by
                                   the platform/portal — tenant-app does not create or
                                   import repositories itself). Applied as the
                                   wxops.cloud/repo-url annotation on all composed
                                   resources — purely metadata for catalog linking.

              labels             object  Default: {}. Extra labels merged onto all
                                   composed resources (Deployment/Darlane/Service/
                                   Ingress). The standard app.kubernetes.io/* and
                                   wxops.cloud/* labels always take precedence — they
                                   cannot be overridden (selectors depend on them).
              deploymentAnnotations object Default: {}. Extra annotations merged onto
                                   the main Deployment's metadata.annotations, alongside
                                   wxops.cloud/template-id, wxops.cloud/repo-url, and
                                   (if reloader.enabled) reloader.stakater.com/auto.

              serviceAccount.create      bool   Default: false. If true, compose a
                                  ServiceAccount named after appName (or .name).
              serviceAccount.name        string Default: appName (when create is true).
                                  When create is false, references an existing SA.
              serviceAccount.annotations object Default: {}. Annotations on the
                                  created SA (e.g. workload identity bindings).
              securityContext     object  Pod-level and container-level security settings.
                                  Pod: runAsNonRoot, runAsUser, runAsGroup, fsGroup.
                                  Container: readOnlyRootFilesystem,
                                  allowPrivilegeEscalation (default false),
                                  capabilities.drop/add.
              terminationGracePeriodSeconds int Default: 30. Seconds to wait for
                                  graceful shutdown after SIGTERM before SIGKILL.

              imagePullSecrets   [string] Names of existing Secrets (type
                                  kubernetes.io/dockerconfigjson) for pulling from
                                  private registries. Added to pod spec on both the
                                  main Deployment and Darlane. Default: [].

              image              string  Container image (repository:tag). e.g. ghcr.io/org/app:1.0.0.
              imagePullPolicy    string  Default: "IfNotPresent".
              replicas           int     Default: 1.
              containerPort      int     Default: 8080.
              resources          object  Passed through to container.resources.
              env                [object] Plain env vars [{name, value}]. Default: [].
              envFrom            [object] Additional envFrom sources, each
                                  {secretRef: {name}} or {configMapRef: {name}}, appended
                                  after secretsFrom.{app,database} (if enabled).
                                  Default: [].
              podAnnotations     object  Annotations applied to the pod template
                                  (e.g. for Prometheus scraping). Default: {}.
              command / args     [string] Optional container command/args overrides.

              secretsFrom.app.enabled              bool   Default: false. If true, adds
                                  secretsFrom.app.secretName to envFrom — the Secret
                                  that a platform-managed ExternalSecret/PushSecret
                                  writes app secrets from Vault into. This XR doesn't
                                  provision or wait for that Secret; GitOps/the platform
                                  must create it (the Deployment will simply fail to
                                  start until it exists).
              secretsFrom.app.secretName           string Default: "{appName}-env".
              secretsFrom.database.enabled         bool   Default: false. Same as
                                  secretsFrom.app but for a database connection-creds
                                  Secret (e.g. produced by a platform-provisioned
                                  XTenantDatabase).
              secretsFrom.database.secretName      string Default: "{appName}-db-creds".

              reloader.enabled   bool    Default: false. If true, adds
                                  reloader.stakater.com/auto: "true" to the
                                  Deployment's annotations so the Stakater Reloader
                                  controller (https://github.com/stakater/Reloader)
                                  restarts pods when referenced ConfigMaps/Secrets
                                  change. Requires Reloader to be installed in-cluster.

              rolloutStrategy.type                       string Default: "RollingUpdate".
                                  One of "RollingUpdate" or "Recreate". Sets
                                  Deployment.spec.strategy — relevant when replicas > 1.
              rolloutStrategy.rollingUpdate.maxSurge       string|int Default: "25%".
                                  Only used when type is "RollingUpdate".
              rolloutStrategy.rollingUpdate.maxUnavailable string|int Default: "25%".
                                  Only used when type is "RollingUpdate".

              service.enabled    bool    Default: true.
              service.type       string  Default: "ClusterIP".
              service.port       int     Default: 80 (targetPort = containerPort).

              probes.liveness.enabled              bool   Default: service.enabled. HTTP GET liveness probe.
              probes.liveness.path                 string Default: "/healthz".
              probes.liveness.port                 int    Default: containerPort.
              probes.liveness.initialDelaySeconds  int    Default: 10.
              probes.liveness.periodSeconds        int    Default: 10.
              probes.liveness.timeoutSeconds       int    Default: 1.
              probes.liveness.failureThreshold     int    Default: 3.
              probes.readiness.*                   same shape as probes.liveness, path
                                                    defaults to "/readyz", initialDelaySeconds
                                                    defaults to 5. Default enabled: service.enabled.
              probes.startup.enabled               bool   Default: false. If enabled, gates
                                                    liveness/readiness until the app's first
                                                    successful health check (for slow-starting
                                                    apps). HTTP GET, path/port default to
                                                    "/healthz"/containerPort, periodSeconds
                                                    default 10, failureThreshold default 30.

              ingress.enabled    bool    Default: false.
              ingress.className  string  Default: "traefik".
              ingress.host       string  Required if ingress.enabled.
              ingress.path       string  Default: "/".
              ingress.pathType   string  Default: "Prefix".
              ingress.tls.enabled     bool    Default: false.
              ingress.tls.secretName  string  Default: "{appName}-tls".
              ingress.tls.clusterIssuer string Optional. If set (and tls.enabled), adds
                                  the cert-manager.io/cluster-issuer annotation so
                                  cert-manager automatically requests a certificate into
                                  tls.secretName. Requires cert-manager and the named
                                  ClusterIssuer to exist in-cluster. If unset,
                                  tls.secretName must be provisioned by some other means.
              ingress.auth.enabled    bool    Default: false. If true, adds the
                                  traefik.ingress.kubernetes.io/router.middlewares
                                  annotation referencing the auth-errors and
                                  forward-auth-redirect Traefik Middleware CRDs living
                                  in kube-system (SSO via oauth2-proxy ForwardAuth, with
                                  a redirect-to-login on 401). Requires Traefik to have
                                  --providers.kubernetescrd.allowCrossNamespace=true and
                                  both Middleware CRDs to exist in kube-system.
              ingress.annotations     object  Default: {}.

              darlane.enabled    bool    Default: false. If true, emits a second
                                  "<appName>-darlane" Deployment sharing the main
                                  Deployment's image/env/envFrom, with no Service/
                                  Ingress of its own (zero external exposure). Intended
                                  as a target for Telepresence/Mirrord.
              darlane.replicas   int     Default: 0. Scale to 1 on-demand to debug.
              darlane.image      string  Optional image override (repository:tag). Defaults to
                                  the main image.
              darlane.command    [string] Default: ["sleep", "infinity"] — keeps the
                                  pod alive for exec/port-forward without serving traffic.
              darlane.serviceAccount.create     bool   Default: false. If true, emit a
                                  ServiceAccount named {appName}-darlane (or .name). Use
                                  the SA token in the portal or CI to authenticate against
                                  the cluster (e.g. with workload identity bindings via
                                  serviceAccount.annotations).
              darlane.serviceAccount.name       string Default: {appName}-darlane (when
                                  create: true). When create: false, references an existing
                                  SA in the target namespace; the Darlane pod runs as that SA.
              darlane.serviceAccount.annotations object Default: {}. Annotations on the
                                  created SA (ignored when create: false).
              darlane.telemetryPort  int   Optional. When set, emits a ClusterIP Service named
                                  {appName}-darlane-telemetry on this port. Provides stable in-cluster
                                  DNS for OTEL collector scraping, Prometheus metrics, or any
                                  secondary port the Darlane pod exposes (e.g. 4318 for OTEL HTTP,
                                  9090 for Prometheus). Works standalone or alongside trafficWeight
                                  for side-by-side A/B observability.
              darlane.volumes    [{name, mountPath, claimName, subPath?, readOnly?}]
                                  Existing PVCs to mount into the Darlane pod. No PVC creation
                                  — reference existing claims only. Useful for persistent caches
                                  and shared data volumes across pod restarts.

              volumes             [{name, mountPath, claimName, subPath?, readOnly?,
                                    create?, storageClass?, size?, accessModes?}]
                                  Volumes to mount into the main app container. Each entry
                                  references an existing PVC (claimName only) or creates a new
                                  one (set create: true with storageClass + size). Composed PVCs
                                  are named after claimName.

            Composed resources:
              app-deployment            apps/v1                       Deployment      — app workload.
              app-pvc-{name}            v1                            PersistentVolumeClaim — (per volumes[].create: true).
              app-darlane-deployment    apps/v1                       Deployment      — Darlane lane (if darlane.enabled).
              app-darlane-sa            v1                            ServiceAccount  — (if darlane.serviceAccount.create).
              app-darlane-telemetry-svc v1                            Service         — (if darlane.telemetryPort set).
              app-service-account       v1                            ServiceAccount  — (if serviceAccount.create).
              app-service               v1                            Service         — (if service.enabled, default true).
              app-certificate           cert-manager.io/v1            Certificate     — (if ingress.tls.clusterIssuer set).
              app-ingress               traefik.io/v1alpha1           IngressRoute    — (if ingress.enabled).
              app-darlane-svc           v1                            Service         — (if darlane.trafficWeight > 0).
              app-weighted-traefikservice traefik.io/v1alpha1         TraefikService  — (if darlane.trafficWeight > 0).

            This XR deliberately stops at the application workload: Vault-backed secrets
            (ExternalSecret/PushSecret) and databases (XTenantDatabase) are platform-level
            concerns wired up separately — apps consume the resulting Secrets via
            `envFrom`.

            """

            oxr = option("params").oxr
            params = oxr.spec.parameters

            # `dict.get(key, default)` does not fall back to `default` for keys that are
            # declared-but-unset on schema-typed objects from oxr.spec.parameters (it
            # returns Undefined instead). Use membership checks via this helper instead.
            _get = lambda d: any, k: str, default: any -> any {
                _safe = d or {}
                _safe[k] if k in _safe else default
            }

            appName = params.appName
            ns = params.namespace

            # ── Target cluster ──────────────────────────────────────────────────
            # Every composed Object is applied through a provider-kubernetes
            # ProviderConfig. "default" is the local (hub) cluster, which is the only
            # one wired up today, so leaving spec.parameters.cluster unset keeps
            # behaviour identical. Naming the ProviderConfig here rather than hardcoding
            # it means adding a spoke later is a ProviderConfig + one field, not an edit
            # to every resource in this file. See docs/core-ideas/multi-cluster.md.
            targetCluster = _get(params, "cluster", "default")
            appFlavor = _get(params, "appFlavor", "webapp")
            environment = _get(params, "environment", "dev")
            _imagePullSecrets = _get(params, "imagePullSecrets", [])
            _terminationGracePeriod = _get(params, "terminationGracePeriodSeconds", 30)

            # ── ServiceAccount ────────────────────────────────────────────────
            _sa = _get(params, "serviceAccount", {})
            _saCreate = _get(_sa, "create", False)
            _saName = _get(_sa, "name", appName) if _saCreate else _get(_sa, "name", "")
            _saAnnotations = _get(_sa, "annotations", {})

            # ── Security context ──────────────────────────────────────────────
            _sc = _get(params, "securityContext", {})

            _podSecurityContext = {} \
                | ({"runAsNonRoot" = _sc.runAsNonRoot} if "runAsNonRoot" in _sc else {}) \
                | ({"runAsUser" = _sc.runAsUser} if "runAsUser" in _sc else {}) \
                | ({"runAsGroup" = _sc.runAsGroup} if "runAsGroup" in _sc else {}) \
                | ({"fsGroup" = _sc.fsGroup} if "fsGroup" in _sc else {})

            _caps = _get(_sc, "capabilities", {})
            _capsObj = {} \
                | ({"drop" = _caps.drop} if "drop" in _caps and len(_caps.drop) > 0 else {}) \
                | ({"add" = _caps.add} if "add" in _caps and len(_caps.add) > 0 else {})

            _containerSecurityContext = {} \
                | ({"readOnlyRootFilesystem" = _sc.readOnlyRootFilesystem} if "readOnlyRootFilesystem" in _sc else {}) \
                | ({"allowPrivilegeEscalation" = _sc.allowPrivilegeEscalation} if "allowPrivilegeEscalation" in _sc else {}) \
                | ({"capabilities" = _capsObj} if len(_capsObj) > 0 else {})

            # _selectorLabels: minimal stable set used ONLY for Deployment.spec.selector and
            # Service.spec.selector. spec.selector is immutable on Deployments — never add
            # new labels here after first deploy. All metadata-only labels (managed-by,
            # app-flavor, environment) belong in pod template labels only.
            _userLabels = _get(params, "labels", {})
            _selectorLabels = {
                "app.kubernetes.io/name" = appName
                "app.kubernetes.io/instance" = appName
                "app.kubernetes.io/component" = "app"
            }
            labels = _userLabels | _selectorLabels | {
                "app.kubernetes.io/managed-by" = "crossplane"
                "wxops.cloud/app-flavor" = appFlavor
                "wxops.cloud/environment" = environment
            }

            # templateId / repository.url are pure catalog-linking metadata (e.g. for a
            # Backstage catalog-info.yaml or portal UI) — applied as annotations on every
            # composed resource. tenant-app neither creates nor imports repositories;
            # repository.url just records where the source lives.
            _templateId = _get(params, "templateId", "")
            _repo = _get(params, "repository", {})
            _repoUrl = _get(_repo, "url", "")

            _commonAnnotations = ({"wxops.cloud/template-id" = _templateId} if _templateId != "" else {}) | ({"wxops.cloud/repo-url" = _repoUrl} if _repoUrl != "" else {})

            # ── Observed state (keyed by Object name, Crossplane v2 / function-kcl v0.12.x) ──
            # Used for: (1) status write-back, and (2) krm.kcl.dev/ready annotations on desired
            # resources so function-kcl emits READY_TRUE instead of READY_UNSPECIFIED — fixing
            # the native type:Ready condition. String "True" is required; v0.12.1 tightened type
            # checks (boolean True no longer accepted by the KRM engine).
            _ocds = option("params").ocds or {}
            _isReady = lambda name: str -> bool {
                _ocd = _ocds[name] if name in _ocds else {}
                _res = _get(_ocd, "Resource", {})
                _conds = _get(_get(_res, "status", {}), "conditions", [])
                len([c for c in _conds if _get(c, "type", "") == "Ready" and _get(c, "status", "") == "True"]) > 0
            }

            # ── Container / Deployment ─────────────────────────────────────────
            _imgStr = params.image
            _pullPolicy = _get(params, "imagePullPolicy", "IfNotPresent")
            containerPort = _get(params, "containerPort", 8080)
            replicas = _get(params, "replicas", 1)

            _env = params.env if "env" in params else []

            # secretsFrom.{app,database} reference Secrets provisioned out-of-band by the
            # platform/GitOps (ExternalSecret/PushSecret for Vault app secrets, an
            # XTenantDatabase's connection-creds for the database) — this XR only wires
            # them into envFrom by name, on a simple default naming convention. It does
            # not wait for or validate that these Secrets exist; that's the platform's
            # responsibility to provision before (or alongside) this XR's resources.
            _secretsFrom = _get(params, "secretsFrom", {})
            _appSecret = _secretsFrom.app if "app" in _secretsFrom else {}
            _dbSecret = _secretsFrom.database if "database" in _secretsFrom else {}

            appSecretEnabled = _get(_appSecret, "enabled", False)
            appSecretName = _get(_appSecret, "secretName", appName + "-env")

            dbSecretEnabled = _get(_dbSecret, "enabled", False)
            dbSecretName = _get(_dbSecret, "secretName", appName + "-db-creds")

            # Order: app secret, then database secret, then explicit envFrom — later
            # entries win on key collisions (Kubernetes envFrom semantics).
            _envFromManaged = ([{"secretRef" = {"name" = appSecretName}}] if appSecretEnabled else []) + ([{"secretRef" = {"name" = dbSecretName}}] if dbSecretEnabled else [])
            _envFromExtra = params.envFrom if "envFrom" in params else []
            _envFrom = _envFromManaged + _envFromExtra

            _podAnnotations = _get(params, "podAnnotations", {})

            _reloader = params.reloader if "reloader" in params else {}
            reloaderEnabled = _get(_reloader, "enabled", False)
            _userDeploymentAnnotations = _get(params, "deploymentAnnotations", {})
            _deploymentAnnotations = _commonAnnotations | _userDeploymentAnnotations | ({"reloader.stakater.com/auto" = "true"} if reloaderEnabled else {})

            _svc = params.service if "service" in params else {}
            serviceEnabled = _get(_svc, "enabled", True)

            # ── Rollout strategy ──────────────────────────────────────────────
            # Deployment.spec.strategy — how Pods are replaced on update when
            # replicas > 1. "RollingUpdate" (default) replaces Pods incrementally
            # (maxSurge/maxUnavailable control the pace); "Recreate" kills all Pods
            # before creating new ones (useful for workloads that can't run multiple
            # versions concurrently, e.g. exclusive DB migrations).
            _rollout = _get(params, "rolloutStrategy", {})
            _rolloutType = _get(_rollout, "type", "RollingUpdate")
            _rollingUpdate = _get(_rollout, "rollingUpdate", {})

            _strategy = {type = _rolloutType} | ({"rollingUpdate" = {
                maxSurge = _get(_rollingUpdate, "maxSurge", "25%")
                maxUnavailable = _get(_rollingUpdate, "maxUnavailable", "25%")
            }} if _rolloutType == "RollingUpdate" else {})

            # Probes default to enabled when the app exposes a Service (i.e. it serves
            # HTTP, the "webapp" pattern) and target containerPort. startupProbe is
            # opt-in — it gates liveness/readiness until the first successful check,
            # useful for slow-starting apps.
            _probes = _get(params, "probes", {})
            _liveness = _probes.liveness if "liveness" in _probes else {}
            _readiness = _probes.readiness if "readiness" in _probes else {}
            _startup = _probes.startup if "startup" in _probes else {}

            livenessEnabled = _get(_liveness, "enabled", serviceEnabled)
            readinessEnabled = _get(_readiness, "enabled", serviceEnabled)
            startupEnabled = _get(_startup, "enabled", False)

            _livenessProbe = {
                httpGet = {path = _get(_liveness, "path", "/healthz"), port = _get(_liveness, "port", containerPort)}
                initialDelaySeconds = _get(_liveness, "initialDelaySeconds", 10)
                periodSeconds = _get(_liveness, "periodSeconds", 10)
                timeoutSeconds = _get(_liveness, "timeoutSeconds", 1)
                failureThreshold = _get(_liveness, "failureThreshold", 3)
            }

            _readinessProbe = {
                httpGet = {path = _get(_readiness, "path", "/readyz"), port = _get(_readiness, "port", containerPort)}
                initialDelaySeconds = _get(_readiness, "initialDelaySeconds", 5)
                periodSeconds = _get(_readiness, "periodSeconds", 10)
                timeoutSeconds = _get(_readiness, "timeoutSeconds", 1)
                failureThreshold = _get(_readiness, "failureThreshold", 3)
            }

            _startupProbe = {
                httpGet = {path = _get(_startup, "path", "/healthz"), port = _get(_startup, "port", containerPort)}
                periodSeconds = _get(_startup, "periodSeconds", 10)
                failureThreshold = _get(_startup, "failureThreshold", 30)
            }

            # ── Volumes (main app) ───────────────────────────────────────────────
            # Volume source is discriminated by which field is set:
            #   claimName     → persistentVolumeClaim  (PVC creation supported via create: true)
            #   configMapName → configMap
            #   secretName    → secret
            # items[] on configMap/secret entries specifies key-to-path projections.
            # KCL list comp bodies must be a single expression — helpers wrap the merge chain.
            _makeVolumeMount = lambda v: any -> any {
                _base = {"name" = v.name, "mountPath" = v.mountPath}
                _sub = _base | ({"subPath" = _get(v, "subPath", "")} if _get(v, "subPath", "") != "" else {})
                _sub | ({"readOnly" = True} if _get(v, "readOnly", False) else {})
            }
            _makePvcSpec = lambda v: any -> any {
                _sc = _get(v, "storageClass", "")
                _base = {accessModes = _get(v, "accessModes", ["ReadWriteOnce"]), resources = {requests = {storage = v.size}}}
                _base | ({"storageClassName" = _sc} if _sc != "" else {})
            }
            _makeVolume = lambda v: any -> any {
                _claimName = _get(v, "claimName", "")
                _cmName = _get(v, "configMapName", "")
                _sName = _get(v, "secretName", "")
                _proj = _get(v, "items", [])
                _projBlock = {"items" = _proj} if len(_proj) > 0 else {}
                {"name" = v.name, "persistentVolumeClaim" = {"claimName" = _claimName}} if _claimName != "" else \
                ({"name" = v.name, "configMap" = {"name" = _cmName} | _projBlock} if _cmName != "" else \
                {"name" = v.name, "secret" = {"secretName" = _sName} | _projBlock})
            }
            _volumes = _get(params, "volumes", [])
            _podVolumes = [_makeVolume(v) for v in _volumes]
            _podVolumeMounts = [_makeVolumeMount(v) for v in _volumes]

            _base_container = {
                name = appName
                image = _imgStr
                imagePullPolicy = _pullPolicy
                ports = [{containerPort = containerPort}]
                env = _env
            }

            _container_env = _base_container | ({"envFrom" = _envFrom} if len(_envFrom) > 0 else {})
            _container_res = _container_env | ({"resources" = params.resources} if "resources" in params else {})
            _container_cmd = _container_res | ({"command" = params.command} if "command" in params else {})
            _container_args = _container_cmd | ({"args" = params.args} if "args" in params else {})
            _container_sec = _container_args | ({"securityContext" = _containerSecurityContext} if len(_containerSecurityContext) > 0 else {})
            _container_liveness = _container_sec | ({"livenessProbe" = _livenessProbe} if livenessEnabled else {})
            _container_readiness = _container_liveness | ({"readinessProbe" = _readinessProbe} if readinessEnabled else {})
            _container_startup = _container_readiness | ({"startupProbe" = _startupProbe} if startupEnabled else {})
            _container = _container_startup | ({"volumeMounts" = _podVolumeMounts} if len(_podVolumeMounts) > 0 else {})

            _deployment = {
                apiVersion = "kubernetes.crossplane.io/v1alpha2"
                kind = "Object"
                metadata = {
                    name = appName + "-deployment"
                    annotations = {
                        "crossplane.io/composition-resource-name" = "app-deployment"
                    } | ({"krm.kcl.dev/ready" = "True"} if _isReady(appName + "-deployment") else {})
                }
                spec = {
                    providerConfigRef = {name = targetCluster}
                    forProvider = {
                        manifest = {
                            apiVersion = "apps/v1"
                            kind = "Deployment"
                            metadata = {
                                name = appName
                                namespace = ns
                                labels = labels
                                annotations = _deploymentAnnotations
                            }
                            spec = {
                                replicas = replicas
                                strategy = _strategy
                                selector = {matchLabels = _selectorLabels}
                                template = {
                                    metadata = {labels = labels, annotations = _podAnnotations}
                                    spec = {containers = [_container]} \
                                        | ({"volumes" = _podVolumes} if len(_podVolumes) > 0 else {}) \
                                        | ({"imagePullSecrets" = [{"name" = s} for s in _imagePullSecrets]} if len(_imagePullSecrets) > 0 else {}) \
                                        | ({"serviceAccountName" = _saName} if _saName != "" else {}) \
                                        | ({"securityContext" = _podSecurityContext} if len(_podSecurityContext) > 0 else {}) \
                                        | ({"terminationGracePeriodSeconds" = _terminationGracePeriod} if _terminationGracePeriod != 30 else {})
                                }
                            }
                        }
                    }
                }
            }

            # ── Darlane (in-cluster developer lane) ─────────────────────────────
            # Scaled to 0 by default — shares image/env/envFrom with the main Deployment,
            # but has no Service/Ingress of its own (zero external exposure). Scale it up
            # on-demand, use mirrord to mirror production traffic, or sync code via SSH sidecar.
            _darlane = params.darlane if "darlane" in params else {}
            _darlaneProdOverride = _get(_darlane, "productionOverride", False)
            _darlaneRequested = _get(_darlane, "enabled", False)
