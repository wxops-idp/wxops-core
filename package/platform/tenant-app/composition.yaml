                            }
                        }
                    }
                }
            }

            _pod_monitor = {
                apiVersion = "kubernetes.crossplane.io/v1alpha2"
                kind = "Object"
                metadata = {
                    name = appName + "-podmonitor"
                    annotations = {
                        "crossplane.io/composition-resource-name" = "app-podmonitor"
                    } | ({"krm.kcl.dev/ready" = "True"} if _isReady(appName + "-podmonitor") else {})
                }
                spec = {
                    providerConfigRef = {name = targetCluster}
                    forProvider = {
                        manifest = {
                            apiVersion = "monitoring.coreos.com/v1"
                            kind = "PodMonitor"
                            metadata = {name = appName, namespace = ns, labels = _monLabels, annotations = _commonAnnotations}
                            spec = {
                                selector = {matchLabels = _selectorLabels}
                                namespaceSelector = {matchNames = [ns]}
                                sampleLimit = _monSampleLimit
                                podMetricsEndpoints = [_monEndpoint]
                            }
                        }
                    }
                }
            }

            # ── Status write-back (dxr) ─────────────────────────────────────────
            # Emitting an item with the XR's own apiVersion/kind writes status fields back
            # to the XR, giving operators a quick signal from `kubectl get xtenantapp`.
            #
            # `ocds` (observed composed resources) holds the last-known state of each
            # Object from provider-kubernetes. Reading the Ready condition here means the
            # XR status.ready reflects real cluster state rather than Crossplane's own
            # potentially-lagging composite Ready condition.
            # created: Objects exist in ocds → the cluster resources were provisioned at least once.
            # ready:   Objects exist AND their Ready condition is True → pods are running.
            _deploymentCreated = (appName + "-deployment") in _ocds
            _serviceCreated = ((appName + "-service") in _ocds) if serviceEnabled else True
            _ingressCreated = ((appName + "-ingress") in _ocds) if ingressEnabled else True
            _appCreated = _deploymentCreated and _serviceCreated and _ingressCreated

            _deploymentReady = _isReady(appName + "-deployment")
            _serviceReady = _isReady(appName + "-service") if serviceEnabled else True
            _ingressReady = _isReady(appName + "-ingress") if ingressEnabled else True
            _appReady = _deploymentReady and _serviceReady and _ingressReady

            # dependenciesReady — composed resources that do NOT gate the core workload but
            # do gate the app being usable end-to-end. Split out rather than folded into
            # `ready` so the portal can render "app is up, TLS still issuing" honestly
            # instead of showing a blanket "not ready" for a serving application.
            #
            # Only the cert-manager Certificate qualifies today. Note this XR does NOT
            # compose an XTenantDatabase — secretsFrom.database merely wires an existing
            # Secret in by name and is explicitly not waited on (see the comment above the
            # Deployment), so there is no database readiness for this XR to report.
            #
            # PVCs are not listed: an unbound PVC keeps its pods from starting, so the
            # Deployment is already unready and `ready` catches it.
            _certReady = _isReady(appName + "-certificate") if _certificateEnabled else True
            _dependenciesReady = _certReady

            # ── Darlane status ──────────────────────────────────────────────────
            # Observed replicas come from the wrapped manifest that provider-kubernetes
            # writes back (Object.status.atProvider.manifest), NOT from spec — reporting
            # desired replicas would claim the twin is up the moment it is requested.
            _observedManifest = lambda name: str -> any {
                _res = _get(_get(_ocds, name, {}), "Resource", {})
                _get(_get(_get(_res, "status", {}), "atProvider", {}), "manifest", {})
            }
            _darlaneObsStatus = _get(_observedManifest(appName + "-darlane-deployment"), "status", {})
            _darlaneObservedReplicas = _get(_darlaneObsStatus, "readyReplicas", 0)

            # KCL has no if/elif chain for assignment — chained ternary is the idiom here.
            _darlaneTrafficMode = "both" if _darlaneWeightedEnabled and _darlaneHeaderRoutingActive \
                else "weighted" if _darlaneWeightedEnabled \
                else "header" if _darlaneHeaderRoutingActive \
                else "none"

            # ttl is a duration string ("4h"), not a timestamp, and KCL has no clock — so
            # echo what was configured and let the consumer combine it with the Deployment's
            # creationTimestamp. Emitting a fabricated expiry would be worse than none.
            _darlaneStatus = {
                ready = _isReady(appName + "-darlane-deployment")
                replicas = _darlaneObservedReplicas
                trafficMode = _darlaneTrafficMode
                ttl = _darlaneTtl
                serviceAccountName = _darlaneSaName
            }

            _appUrl = ("https://" if _get(_ingTls, "enabled", False) else "http://") + _get(_ing, "host", "") if ingressEnabled else ""
            _dxr = {
                apiVersion = oxr.apiVersion
                kind = oxr.kind
                status = {
                    created = _appCreated
                    ready = _appReady
                    dependenciesReady = _dependenciesReady
                    url = _appUrl
                    namespace = ns
                    image = params.image
                } | ({"darlane" = _darlaneStatus} if darlaneEnabled else {})
            }

            # ── Final resource list ─────────────────────────────────────────────
            items = [_dxr, _deployment] \
                + _pvc_items \
                + ([_darlane_deployment] if darlaneEnabled else []) \
                + ([_darlane_sa] if darlaneEnabled and _darlaneSaCreate else []) \
                + ([_darlane_telemetry_service] if darlaneEnabled and _darlaneTelemetryPort > 0 else []) \
                + ([_serviceAccount] if _saCreate else []) \
                + ([_service] if serviceEnabled else []) \
                + ([_darlane_service] if _darlaneSvcNeeded else []) \
                + ([_darlane_traefik_service] if _darlaneWeightedEnabled else []) \
                + ([_certificate] if _certificateEnabled else []) \
                + ([_ingress_object] if ingressEnabled else []) \
                + ([_ingress_header_object] if _darlaneHeaderRoutingActive else []) \
                + ([_service_monitor] if _serviceMonitorActive else []) \
                + ([_pod_monitor] if _podMonitorActive else [])
