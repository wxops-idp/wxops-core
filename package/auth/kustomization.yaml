# The `auth.wxops.cloud` category: OIDC configuration, Dex the first broker (RFC-004).
#
#   kubectl apply -k package/auth/     — install just this category from source
#
# Each entry is a DIRECTORY with its own kustomization.yaml, which is what keeps
# Kustomize's root-only load restriction satisfied (see package/dev/kustomization.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - oidc-connection
  - oidc-static-password
  - oidc-client
  - oidc-connector
