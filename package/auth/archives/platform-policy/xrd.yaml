apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xplatformpolicies.auth.wxops.cloud
spec:
  group: auth.wxops.cloud
  scope: Cluster
  names:
    kind: XPlatformPolicy
    plural: xplatformpolicies
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - parameters
              properties:
                parameters:
                  type: object
                  required:
                    - template
                    - scmOrgs
                  x-kubernetes-validations:
                    - rule: "self.template != 'exec-guard' || self.personaRef.name != ''"
                      message: "template 'exec-guard' needs personaRef — the persona that may exec"
                    - rule: "self.template != 'env-gate' || self.personaRef.name != ''"
                      message: "template 'env-gate' needs personaRef — the persona that may change the guarded environments"
                    - rule: "self.template in ['exec-guard', 'env-gate'] || self.personaRef.name == ''"
                      message: "personaRef is for templates 'exec-guard' and 'env-gate' only"
                    - rule: "self.template != 'env-gate' || (has(self.environments) && size(self.environments) > 0)"
                      message: "template 'env-gate' needs environments — which namespaces' wxops.cloud/environment it guards"
                    - rule: "self.template == 'env-gate' || !has(self.environments)"
                      message: "environments is for template 'env-gate' only"
                    - rule: "self.temporaryExemptPersonaRef.name == '' || has(self.temporaryExemptPersonaRef.until)"
                      message: "temporaryExemptPersonaRef needs until — when the exemption ends"
                    - rule: "self.template == 'owner-seal' || (!has(self.ownerPattern) && !self.immutableOwner)"
                      message: "ownerPattern and immutableOwner are options of template 'owner-seal' only"
                  properties:
                    template:
                      type: string
                      description: |
                        Which reviewed rule to render. Policies are templates with parameters, not free-form CEL: a new rule is a change to this package, with tests.

                        `owner-stamp` — a MutatingPolicy: a new object in a tenant namespace gets that namespace's `wxops.cloud/owner` label if it has none.

                        `owner-seal` — a ValidatingPolicy: an SCM user creates, updates or deletes an object only if its owner is one of their teams. The owner is the
                        object's `wxops.cloud/owner` label, or — for an unlabelled namespaced object — its namespace's. On update, both the old and the new owner must be theirs.

                        `secret-guard` — an SCM user cannot create, update or delete a `Secret`: Secrets are written by External Secrets Operator from OpenBao,
                        where teams also read their values. Reading Secrets in Kubernetes is RBAC's, and team roles do not grant it.

                        `exec-guard` — `exec`, `attach` and `port-forward` only for the members of `personaRef`, and only in namespaces one of their teams owns.

                        `protected` — an SCM user cannot update or delete an object labelled `wxops.cloud/protected: "true"`.

                        `rbac-guard` — an SCM user cannot write a `Role`, `RoleBinding`, `ClusterRole`, `ClusterRoleBinding` or any `auth.wxops.cloud` kind. Bindings are
                        `XPersonaBinding`'s; without this a team `admin`, who may create RoleBindings in its namespace, could bind around it.

                        `sa-guard` — a Pod, or a workload's pod template, created or updated by an SCM user runs only as `default` or a ServiceAccount whose
                        `wxops.cloud/owner` is one of their teams — no one runs a workload as another team's, or the platform's, ServiceAccount.

                        `namespace-guard` — an SCM user cannot create or delete a Namespace, nor change its `wxops.cloud/owner`,
                        `auth.wxops.cloud/tenant-namespace` or `wxops.cloud/environment` label: the labels every other rule trusts.

                        `env-gate` — in a namespace whose `wxops.cloud/environment` is one of `environments`, an SCM user creates, updates, deletes or
                        exec/attach/port-forwards only as a member of `personaRef` whose own `environments` include that namespace's. The same holds for an
                        XApp or XDatabase whose own `spec.parameters.environment` is one of `environments`, in any namespace — checked on the object before and
                        after the change, so a guarded environment cannot be renamed to slip past. Everyone else goes through Git — Argo CD is never matched.
                      enum:
                        - owner-stamp
                        - owner-seal
                        - secret-guard
                        - exec-guard
                        - protected
                        - rbac-guard
                        - sa-guard
                        - namespace-guard
                        - env-gate
                    mode:
                      type: string
                      description: |
                        `Deny` refuses a request that breaks the rule and, with `failurePolicy: Fail`, one Kyverno cannot check — the supported mode. `Audit` lets
                        it through and records a PolicyReport; not supported by W'xOps yet, which runs no reports controller, so an `Audit` policy neither blocks nor
                        records. Ignored by `owner-stamp`, which only mutates.
                      enum:
                        - Audit
                        - Deny
                      default: Deny
                    scmOrgs:
                      type: array
                      description: |
                        The SCM orgs whose `<org>:<team>` groups make a caller an SCM user. A policy matches SCM users only — never a `system:` username, never a controller,
                        Crossplane or Argo CD. Use the same orgs as the `XOIDCConnector` that admits them.
                      minItems: 1
                      items:
                        type: string
                        pattern: '^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$'
                    personaRef:
                      type: object
                      description: |
                        The persona `exec-guard` lets exec, or `env-gate` lets change the guarded environments. Read for its groups and users (and, for
                        `env-gate`, its `environments`). Empty means none — the composition looks the persona up by this name at every reconcile, so the field is
                        always present.
                      default: {name: ""}
                      required:
                        - name
                      properties:
                        name:
                          type: string
                          default: ""
                    exemptPersonaRef:
                      type: object
                      description: |
                        A persona the policy does not apply to, for good — the platform team — on any validating template. Empty, nobody is exempt. Its requests never
                        reach Kyverno. If the persona cannot be found the policy is rendered with no exemption, and `syncMessage` says so: a missing persona makes a
                        policy stricter, never looser. For a while instead, use `temporaryExemptPersonaRef`.
                      default: {name: ""}
                      required:
                        - name
                      properties:
                        name:
                          type: string
                          default: ""
                    temporaryExemptPersonaRef:
                      type: object
                      description: |
                        A second persona the policy does not apply to, until `until` — someone let past a rule while they debug, beside the standing
                        `exemptPersonaRef`. Checked by Kyverno on every request (its clock), so it ends without a recompose; past `until` the policy applies to the
                        persona like everyone else. While it lasts the persona's requests reach Kyverno, and wait on it. A missing persona, or a name without
                        `until`, exempts nobody. An exemption only gets past the policy: RBAC still decides first.
                      default: {name: ""}
                      required:
                        - name
                      properties:
                        name:
                          type: string
                          default: ""
                        until:
                          type: string
                          format: date-time
                          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
                          description: |
                            Required with a name. UTC, RFC 3339 with `Z`, e.g. `2026-11-06T18:00:00Z`. Generate it with
                            `date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ` (macOS: `date -u -v+2H +%Y-%m-%dT%H:%M:%SZ`).
                    environments:
                      type: array
                      description: |
                        For `env-gate`: the environments it guards — namespaces whose `wxops.cloud/environment` label is one of these, and an XApp or XDatabase
                        whose own `spec.parameters.environment` is one of these, for example `[prod]`.
                      minItems: 1
                      items:
                        type: string
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                    namespaceSelector:
                      type: object
                      description: |
                        Optional. The policy applies only in namespaces whose labels match — a standard label selector, for example `exec-guard` only where
                        `wxops.cloud/environment: prod`. A namespaced object is matched by its namespace's labels, a `Namespace` by its own; a cluster-scoped object is
                        never skipped by a namespace selector, so `owner-seal` on Core XRs and `rbac-guard`'s cluster bindings still apply everywhere. `owner-stamp`
                        keeps its `auth.wxops.cloud/tenant-namespace` label on top of this one. Absent: every namespace.
                      properties:
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
                        matchExpressions:
                          type: array
                          items:
                            type: object
                            required:
                              - key
                              - operator
                            properties:
                              key:
                                type: string
                              operator:
                                type: string
                                enum:
                                  - In
                                  - NotIn
                                  - Exists
                                  - DoesNotExist
                              values:
                                type: array
                                items:
                                  type: string
                    ownerPattern:
                      type: string
                      description: |
                        For `owner-seal`: the owner label must match this regular expression on create and update — the team-slug pattern for Core XRs, which
                        have no namespace to fall back on. Absent, any owner value is accepted.
                    immutableOwner:
                      type: boolean
                      description: |
                        For `owner-seal`: on update the owner must not change at all — not even between two of the caller's own teams. Core XRs are sealed this way;
                        a namespaced object may be moved by its owners.
                      default: false
            status:
              type: object
              properties:
                created:
                  type: boolean
                  description: |
                    True once the policy has been applied at least once.

                    Absent — not false — until then. Treat absent as false.
                ready:
                  type: boolean
                  description: True when the policy is applied and in sync.
                synced:
                  type: boolean
                  description: |
                    False while the policy failed its last apply, or a referenced persona cannot be found. `syncMessage` says what. Absent until the first reconcile.
                syncMessage:
                  type: string
                  description: The provider's own message, or which persona is missing; truncated.
                policyName:
                  type: string
                  description: The Kyverno policy this resource renders.
                policyKind:
                  type: string
                  description: '`ValidatingPolicy` or `MutatingPolicy`.'
                appPolicyName:
                  type: string
                  description: For `env-gate` only — the second Kyverno policy, on an application's own environment (`<policyName>-apps`).
