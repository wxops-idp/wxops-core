apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: scm-oauth-app
  annotations:
    meta.crossplane.io/maintainer: W'xOps Platform Team
    meta.crossplane.io/description: Registers a host-side OAuth application (or adopts one) and publishes its credentials to the secret store.
    meta.crossplane.io/source: github.com/wxops-idp/wxops-core
    meta.crossplane.io/license: Apache-2.0
spec:
  crossplane:
    version: ">=v2.3.0-0"
  dependsOn:
    - provider: xpkg.upbound.io/upbound/provider-opentofu
      version: ">=v1.1.9"
    - provider: xpkg.upbound.io/crossplane-contrib/provider-kubernetes
      version: ">=v1.2.1"
    - function: xpkg.upbound.io/crossplane-contrib/function-patch-and-transform
      version: ">=v0.10.6"
