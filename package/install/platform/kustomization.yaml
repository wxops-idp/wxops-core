# Production install for the `platform.wxops.cloud` packages.
#
# Pins are written by `make release` (.gitea/scripts/release-state.py), never by
# hand: each package points at the release it last changed in.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - platform-database-clusters.yaml
  - tenant-database.yaml
  - tenant-app.yaml
