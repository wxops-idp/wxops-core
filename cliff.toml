# cliff.toml — git-cliff configuration for W'xOps Core
#
# Usage:
#   git-cliff -o CHANGELOG.md                  # write to file
#   git-cliff                                  # print to stdout (preview)
#   git-cliff --tag release-2026-09-11         # preview changelog for a new release
#
# Install: cargo install git-cliff   OR   pip install git-cliff
#
# Releases are named release-YYYY-MM-DD[.N]. Releases before that switch kept
# their semver tags (v0.1.0 … v0.4.0); tag_pattern accepts both so the history
# is never dropped, and the series-diff block below only applies to semver pairs.

[changelog]
header = """
# Changelog

All notable changes to W'xOps Core packages are documented here.

Format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).
Commit messages follow [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/).

> **Releases are named by date** — `release-YYYY-MM-DD` — from the first release after `v0.4.0`.
> A release name says *when*, not what is compatible. Compatibility is the XRD API version
> (`platform.wxops.cloud/v1alpha1`), held additive-only by `tests/api_compat.py`. See
> [`release-notes/README.md`](release-notes/README.md).

> This file is regenerated from git history by running `make changelog`.
> Do not edit it manually.

> Each release below links to a tag-pinned snapshot of [`docs/`](docs/) and [`development-docs/`](development-docs/)
> (API reference) and [`VERSIONS.yaml`](VERSIONS.yaml) as they existed at
> that tag — not the current `main`. Follow the links in-repo for the
> latest state.

---
"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} ⚠️ **BREAKING**{% endif %} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/wxops/wxops-core/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
{% if version %}
📖 [API reference](https://github.com/wxops/wxops-core/tree/{{ version }}/docs) · [`VERSIONS.yaml`](https://github.com/wxops/wxops-core/blob/{{ version }}/VERSIONS.yaml)
{% if previous and previous.version %}\
{% if version is starting_with("v") and previous.version is starting_with("v") %}\
{% set cur = version | trim_start_matches(pat="v") | split(pat=".") %}\
{% set prev = previous.version | trim_start_matches(pat="v") | split(pat=".") %}\
{% if cur.0 != prev.0 or cur.1 != prev.1 %}\
{% set prev_series_base = "v" ~ prev.0 ~ "." ~ prev.1 ~ ".0" %}\
🔍 [Full series diff ({{ prev_series_base }} → {{ version }})](https://github.com/wxops/wxops-core/compare/{{ prev_series_base }}...{{ version }})

> ⚠️ **Major/minor version bump** — this diff covers the entire **{{ prev.0 }}.{{ prev.1 }}.x**
> patch series ({{ prev_series_base }} through {{ previous.version }}) so no intermediate patch is missed.
> Check [`VERSIONS.yaml`](https://github.com/wxops/wxops-core/blob/{{ version }}/VERSIONS.yaml)
> for affected packages and [`docs/`](https://github.com/wxops/wxops-core/tree/{{ version }}/docs)
> for schema changes.
{% else %}\
🔍 [Diff vs {{ previous.version | trim_start_matches(pat="v") }}](https://github.com/wxops/wxops-core/compare/{{ previous.version }}...{{ version }})
{% endif %}\
{% else %}\
🔍 [Diff vs {{ previous.version | trim_start_matches(pat="v") }}](https://github.com/wxops/wxops-core/compare/{{ previous.version }}...{{ version }})
{% endif %}\
{% endif %}\
{% endif %}\
"""

footer = """
---
{% for release in releases %}\
{% if release.version %}\
[{{ release.version | trim_start_matches(pat="v") }}]: \
https://github.com/wxops/wxops-core/releases/tag/{{ release.version }}
{% endif %}\
{% endfor %}\
{% set latest = releases | filter(attribute="version") | first %}\
{% if latest %}\
[Unreleased]: https://github.com/wxops/wxops-core/compare/{{ latest.version }}...HEAD
{% endif %}\
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = []

# Map conventional commit types to changelog section headings.
commit_parsers = [
  { message = "^feat\\((.*)\\)!",   group = "Breaking Changes" },
  { message = "^fix\\((.*)\\)!",    group = "Breaking Changes" },
  { message = "^feat",              group = "Features" },
  { message = "^fix",               group = "Bug Fixes" },
  { message = "^perf",              group = "Performance" },
  { message = "^refactor",          group = "Refactor" },
  { message = "^docs",              group = "Documentation" },
  { message = "^test",              group = "Testing" },
  { message = "^chore\\(ci\\)",                  group = "CI/CD" },
  { message = "^chore: bump package images", skip = true },
  { message = "^chore\\(release\\): ",          skip = true },
  { message = "^chore",                         group = "Chores" },
  { message = "^revert",                        group = "Reverts" },
]

# Package-level scopes — these keep per-package history filterable.
# Valid scopes: gitea-user, gitea-org, gitea-team, gitea-repository,
#               platform-database-clusters, tenant-database, tenant-app,
#               random-password, scm-connection, scm-repository, scm-oauth-app,
#               ci, providers, docs
protect_breaking_commits = true
filter_commits = false
# Literal string: a TOML basic string would reject the `\.` escapes.
tag_pattern = '^(v[0-9]+\.[0-9]+\.[0-9]+|release-[0-9]{4}-[0-9]{2}-[0-9]{2}(\.[0-9]+)?)$'
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "newest"
