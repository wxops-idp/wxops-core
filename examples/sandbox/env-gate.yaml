# The env-gate template, in the sandbox — applied by `./run.sh env-gate`, which labels wxops-sbx-b as prod, checks each row and removes everything after.
#
# env-gate guards chosen environments by the namespace's own `wxops.cloud/environment` label: in a namespace whose environment is listed, a person writes
# or execs only as a member of `personaRef` whose own `environments` include it; everyone else changes it through Git — Argo CD and controllers are never
# matched. The API server skips every other namespace before Kyverno is called, and `namespace-guard` keeps people from relabelling their way out.
#
# B (team-b's) is the guarded namespace, so owner-seal lets team-b write there and any refusal is env-gate's: bob is in the trusted persona, dan — the
# same team, the same RBAC — is not. exec is left out: exec-guard refuses both of them in B anyway, so it would not tell the two policies apart.
apiVersion: auth.wxops.cloud/v1alpha1
kind: XPersona
metadata:
  name: sbx-prod
spec:
  crossplane:
    compositionRevisionSelector:
      matchLabels:
        channel: nightly
    compositionUpdatePolicy: Automatic
  parameters:
    description: Scenario persona trusted with production — bob only
    environments: [prod]
    members:
      teams: false
      users: [bob]
---
apiVersion: auth.wxops.cloud/v1alpha1
kind: XPolicy
metadata:
  name: sbx-env-gate
spec:
  crossplane:
    compositionRevisionSelector:
      matchLabels:
        channel: nightly
    compositionUpdatePolicy: Automatic
  parameters:
    template: env-gate
    mode: Deny
    scmOrgs: [wxops-sbx]
    environments: [prod]
    personaRef: {name: sbx-prod}
    exemptPersonaRef: {name: sbx-platform}
