# The exec-guard template, in the sandbox — applied by run.sh after the personas in sandbox.yaml are ready.
apiVersion: auth.wxops.cloud/v1alpha1
kind: XPolicy
metadata:
  name: sbx-exec-guard
spec:
  crossplane:
    compositionRevisionSelector:
      matchLabels:
        channel: nightly
    compositionUpdatePolicy: Automatic
  parameters:
    template: exec-guard
    mode: Deny
    scmOrgs: [wxops-sbx]
    personaRef: {name: sbx-devs}
    exemptPersonaRef: {name: sbx-platform}
