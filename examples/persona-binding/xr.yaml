# Binds a persona to a role (RFC-009). `scope: owned` (the default) puts a RoleBinding in every namespace a team owns — labelled
# `auth.wxops.cloud/tenant-namespace: "true"` and `wxops.cloud/owner: <team>` — for that team's group only: `wxops-idp:payment` in `payment`'s namespaces,
# never in `checkout`'s. Siblings in this folder: viewers (the Platform API, cluster-wide), platform (the platform team), owners (admin).
#
# A tenant namespace, as onboarding creates it:
#   kind: Namespace
#   metadata:
#     name: payment-api
#     labels:
#       auth.wxops.cloud/tenant-namespace: "true"
#       wxops.cloud/owner: payment
apiVersion: auth.wxops.cloud/v1alpha1
kind: XPersonaBinding
metadata:
  name: developers-edit
spec:
  parameters:
    personaRef:
      name: developers
    role: wxops:persona-developers     # view, edit and admin plus W'xOps extras — or plain `edit`
