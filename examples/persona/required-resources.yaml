# Fixture for `make render`: the XScmTeams a persona draws its members from. `payment` is labelled for the `developers` persona; `checkout` is not.
apiVersion: scm.wxops.cloud/v1alpha1
kind: XScmTeam
metadata:
  name: payment
  labels:
    scm.wxops.cloud/oidc-login: "true"
    auth.wxops.cloud/persona-developers: "true"
status:
  org: wxops-idp
  dexTeam: payment
  oidcGroup: wxops-idp:payment
---
apiVersion: scm.wxops.cloud/v1alpha1
kind: XScmTeam
metadata:
  name: checkout
  labels:
    scm.wxops.cloud/oidc-login: "true"
status:
  org: wxops-idp
  dexTeam: checkout
  oidcGroup: wxops-idp:checkout
