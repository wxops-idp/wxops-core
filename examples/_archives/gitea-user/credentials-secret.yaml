apiVersion: v1
kind: Secret
metadata:
  name: gitea-credentials
  namespace: crossplane-system
type: Opaque
stringData:
  # Content must be valid tfvars syntax.
  # gitea_token: admin API token — Gitea → Settings → Applications → Generate Token
  #
  # scope: ["admin:read and write", "repo:read and write", "user:read and write", "org:read and write"]
  #
  # No password field needed. The initial user password is auto-generated by
  # Terraform's random provider and emailed to the user via Gitea's SMTP integration.
  credentials: |
    gitea_token = "your-admin-api-token"
