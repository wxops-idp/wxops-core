# The secret-guard template, in the sandbox — applied by run.sh after the personas in sandbox.yaml are ready.
apiVersion: auth.wxops.cloud/v1alpha1
kind: XPolicy
metadata:
  name: sbx-secret-guard
spec:
  crossplane:
    compositionRevisionSelector:
      matchLabels:
        channel: nightly
    compositionUpdatePolicy: Automatic
  parameters:
    template: secret-guard
    mode: Deny
    scmOrgs: [wxops-sbx]
