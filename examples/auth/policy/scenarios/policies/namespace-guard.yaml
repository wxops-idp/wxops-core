# The namespace-guard template, in the sandbox — applied by run.sh after the personas in sandbox.yaml are ready.
apiVersion: auth.wxops.cloud/v1alpha1
kind: XPolicy
metadata:
  name: sbx-namespace-guard
spec:
  crossplane:
    compositionRevisionSelector:
      matchLabels:
        channel: nightly
    compositionUpdatePolicy: Automatic
  parameters:
    template: namespace-guard
    mode: Deny
    scmOrgs: [wxops-sbx]
    exemptPersonaRef: {name: sbx-platform}
