# Test-only RBAC, applied as you by `./run.sh setup`: team-b may write Namespaces cluster-wide, so namespace-guard is the only thing that stops it.
# No persona role grants this — a Namespace is cluster-scoped, and team roles are bound per namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wxops-sbx-namespace-editor
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wxops-sbx-namespace-editor
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: wxops-sbx-namespace-editor}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: "wxops-sbx:team-b"}
