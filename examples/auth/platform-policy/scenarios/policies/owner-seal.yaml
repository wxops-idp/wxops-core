# The owner-seal template, in the sandbox — applied by run.sh after the personas in sandbox.yaml are ready.
apiVersion: auth.wxops.cloud/v1alpha1
kind: XPlatformPolicy
metadata:
  name: sbx-owner-seal
spec:
  crossplane:
    compositionRevisionSelector:
      matchLabels:
        channel: nightly
    compositionUpdatePolicy: Automatic
  parameters:
    template: owner-seal
    mode: Deny
    scmOrgs: [wxops-sbx]
    exemptPersonaRef: {name: sbx-platform}
