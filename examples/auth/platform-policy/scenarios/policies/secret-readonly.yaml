# The secret-readonly template, in the sandbox — applied by run.sh after the personas in sandbox.yaml are ready.
apiVersion: auth.wxops.cloud/v1alpha1
kind: XPlatformPolicy
metadata:
  name: sbx-secret-readonly
spec:
  crossplane:
    compositionRevisionSelector:
      matchLabels:
        channel: nightly
    compositionUpdatePolicy: Automatic
  parameters:
    template: secret-readonly
    mode: Deny
    scmOrgs: [wxops-sbx]
