# The sandbox personas' bindings — applied by run.sh once the personas in sandbox.yaml are ready.
# admin in the namespace each team owns (scope owned: team-a → wxops-sbx-a, team-b → wxops-sbx-b) ...
apiVersion: auth.wxops.cloud/v1alpha1
kind: XPersonaBinding
metadata:
  name: sbx-teams-owned
spec:
  crossplane:
    compositionRevisionSelector:
      matchLabels:
        channel: nightly
    compositionUpdatePolicy: Automatic
  parameters:
    personaRef: {name: sbx-teams}
    role: admin
    scope: owned
---
# ... and edit in both, so RBAC lets each team write the other's namespace and only the policies stop it — the case owner-seal exists for.
apiVersion: auth.wxops.cloud/v1alpha1
kind: XPersonaBinding
metadata:
  name: sbx-teams-both
spec:
  crossplane:
    compositionRevisionSelector:
      matchLabels:
        channel: nightly
    compositionUpdatePolicy: Automatic
  parameters:
    personaRef: {name: sbx-teams}
    role: edit
    scope: namespaces
    namespaces: [wxops-sbx-a, wxops-sbx-b]
---
apiVersion: auth.wxops.cloud/v1alpha1
kind: XPersonaBinding
metadata:
  name: sbx-platform-both
spec:
  crossplane:
    compositionRevisionSelector:
      matchLabels:
        channel: nightly
    compositionUpdatePolicy: Automatic
  parameters:
    personaRef: {name: sbx-platform}
    role: admin
    scope: namespaces
    namespaces: [wxops-sbx-a, wxops-sbx-b]
