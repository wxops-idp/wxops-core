  crossplane:
    compositionRevisionSelector:
      matchLabels:
        channel: nightly
    compositionUpdatePolicy: Automatic
  parameters:
    connectionRef: {name: dex}
    email: bob@sbx.wxops.local
    username: sbx-bob
    displayName: Scenario bob (team-b)
    groups: ["wxops-sbx:team-b"]
    secret: {source: generate}
---
