# Dex static users for run.sh's `IDENTITY=dex` mode — the sandbox groups have no Git team behind them. Passwords are generated; read one with
#   bao kv get -mount=platform -field=password dex/users-def/sbx-alice
apiVersion: auth.wxops.cloud/v1alpha1
kind: XOIDCStaticPassword
metadata:
  name: sbx-alice
spec:
  crossplane:
    compositionRevisionSelector:
      matchLabels:
        channel: nightly
    compositionUpdatePolicy: Automatic
  parameters:
    connectionRef: {name: dex}
    email: alice@sbx.wxops.local
    username: sbx-alice
    displayName: Scenario alice (team-a)
    groups: ["wxops-sbx:team-a"]
    secret: {source: generate}
---
