# The rule that makes "edit" mean "edit your own" (RFC-009). Every policy starts in Audit: it records what it would refuse as a PolicyReport and lets the request
# through; move it to Deny once its reports are clean. A policy matches SCM users only — callers with a "<org>:<team>" group of a listed org, never a `system:` username —
# so controllers, Crossplane, ESO and Argo CD are never matched. Siblings in this folder, one per template: owner-stamp, owner-seal-core, secret-readonly,
# exec-guard, protected, rbac-guard.
apiVersion: auth.wxops.cloud/v1alpha1
kind: XPlatformPolicy
metadata:
  name: owner-seal
spec:
  parameters:
    template: owner-seal
    scmOrgs: [wxops-idp]
    exemptPersonaRef:
      name: platform
