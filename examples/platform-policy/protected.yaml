# An object labelled wxops.cloud/protected: "true" cannot be updated or deleted by an SCM user — shared or platform objects inside a team's namespace.
apiVersion: auth.wxops.cloud/v1alpha1
kind: XPlatformPolicy
metadata:
  name: protected
spec:
  parameters:
    template: protected
    scmOrgs: [wxops-idp]
    exemptPersonaRef:
      name: platform
