# exec, attach and port-forward only for the owners persona, and only in a namespace one of their teams owns.
apiVersion: auth.wxops.cloud/v1alpha1
kind: XPlatformPolicy
metadata:
  name: exec-guard
spec:
  parameters:
    template: exec-guard
    scmOrgs: [wxops-idp]
    personaRef:
      name: owners
    exemptPersonaRef:
      name: platform
