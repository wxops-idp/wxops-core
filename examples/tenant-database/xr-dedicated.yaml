apiVersion: platform.wxops.cloud/v1alpha1
kind: XTenantDatabase
metadata:
  name: rocket-team-analytics-db
  labels:
    wxops.cloud/tenant-database: "true"
spec:
  # spec.crossplane is a sibling of spec.parameters, not a field inside it — track a channel
  # (every release labels its Composition channel: stable; make install-dev applies channel:
  # nightly). See development-docs/development/releasing.md#channels for the Manual-pin alternative.
  # crossplane:
  #   compositionRevisionSelector:
  #     matchLabels:
  #       channel: stable          # or nightly
  #   compositionUpdatePolicy: Automatic
  parameters:
    tier: dedicated
    environment: dev
    dedicatedCluster:
      instances: 1
      storageSize: "1Gi"
      postgresVersion: 16
      enablePooler: true
      # namespace: cnpg-system  # default

    dbName: analytics-db
    owner: rocket-team
    extensions:
      - uuid-ossp
      - pgcrypto

    # databaseReclaimPolicy: "retain"
    vaultSecretStoreName: "vault-tenant"
